- id: suite_anno_ctx_dismiss_s1
  name: 右键菜单关闭 — 右键注释菜单后点击外部关闭
  module: 右键菜单关闭
  annotation:
    测试界面: 右键菜单关闭
    测试功能: 侧栏右键注释弹出菜单后点击文档区域关闭菜单
    前置条件: deepin-reader 已打开一个 PDF 文档
    AT元素: n8 (Form_CentralDocPage), n265 (PTextEdit), n17 (Button_annotation), n25 (View_ImageList), n224 (Button_ThumbnailToggle)
    覆盖缺口: 1581161
  steps:
  - step_type: action
    description: 展开侧边栏
    element_ref: n224
    selector:
      name: Button_ThumbnailToggle
    action: mouse_click
  - step_type: action
    description: 文档区域右键菜单"添加注释"
    selector:
      name: Form_CentralDocPage
    action: dtk_context_menu
    items:
    - 添加注释
  - step_type: action
    description: 点击注释文本框并输入文字
    element_ref: n265
    selector:
      name: PTextEdit
      role: text
