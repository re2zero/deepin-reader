      name: Button_ThumbnailToggle
    action: mouse_click
  - step_type: action
    description: 展开左侧栏，点击目录按钮
    element_ref: n15
    selector:
      name: Button_catalog
    action: mouse_click
  - step_type: assert
    description: 显示目录树(View_CatalogTree)
    element_ref: n163
    selector:
      name: View_CatalogTree
    action: assert_element
  - step_type: action
    description: 点击目录树中任意一个目录项
    element_ref: n163
