name: 注释输入限制_suite
app: deepin-reader
description: 注释输入字数限制提示
module: 注释输入限制
tags: []
fast_fail: false
vars:
  TEST_FILES_DIR: ${PROJECT_ROOT}/tests/at/files/
env_check: []
setup:
- action: session_start
  command: pkill -9 -x deepin-reader || true; sleep 1; rm -rf ~/.local/share/deepin/deepin-reader ~/.config/deepin/deepin-reader ~/.cache/deepin/deepin-reader; deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
# Case 1: 输入超长文本触发限制提示
- id: suite_anno_input_limit_s1
  name: 注释输入限制 — 输入超长文本触发Tips提示
  description: 创建注释后在PTextEdit中输入1500个字符，验证Tips输入限制提示出现
  tags: []
  steps:
  # 展开侧边栏
  - action: mouse_click
    ref: n224
    selector:
      name: Button_ThumbnailToggle
    wait: 2.0
  # 创建注释
  - action: dtk_context_menu
    selector:
      name: Form_CentralDocPage
    items:
    - 添加注释
    wait: 3.0
  # 点击注释文本框并输入超长文本
  - action: mouse_click
    ref: n265
    selector:
      name: PTextEdit
      role: text
  - action: keyboard_type_text
    text: 
    wait: 2.0
  assert_steps:
  # Tips 提示出现
  - action: assert_element
    ref: n268
    selector:
      name: Tips
      role: label
teardown:
- action: session_stop
