name: 幻灯片播放_suite
app: deepin-reader
description: ''
module: 幻灯片播放
tags: []
fast_fail: false
vars:
  TEST_FILES_DIR: ${PROJECT_ROOT}/tests/at/files/
env_check: []
setup:
- action: session_start
  command: pkill -9 -x deepin-reader || true; sleep 1; rm -rf ~/.local/share/deepin/deepin-reader ~/.config/deepin/deepin-reader ~/.cache/deepin/deepin-reader; deepin-reader ${TEST_FILES_DIR}/normal.pdf
  wait: 3.0
suites:
- id: suite_slide_play_s1
  name: 幻灯片播放 — 上一张/播放暂停/下一张
  description: F5 进入幻灯片放映，浮层出现上一张(PreBtn)、播放/暂停(PlayBtn)、下一张(NextBtn)三个按钮
  tags: []
  steps:
  # 按 F5 进入幻灯片放映，幻灯片浮层控件出现
  - action: keyboard_press
    key: f5
    wait: 2.0
  # 上一张按钮
  - action: mouse_click
    ref: n263
    selector:
      name: PreBtn
  # 播放/暂停按钮（切换播放状态）
  - action: mouse_click
    ref: n262
    selector:
      name: PlayBtn
  # 下一张按钮
  - action: mouse_click
    ref: n264
    selector:
      name: NextBtn
  assert_steps:
  # 三个幻灯片控制按钮均可定位
  - action: assert_element
    ref: n263
    selector:
      name: PreBtn
      role: button
  - action: assert_element
    ref: n262
    selector:
      name: PlayBtn
      role: button
  - action: assert_element
    ref: n264
    selector:
      name: NextBtn
      role: button
teardown:
- action: session_stop
