name: 标签页管理_suite
app: deepin-reader
description: '阶段四：标签页管理 — 添加/滚动/关闭保存/搜索独立/新窗口'
module: 标签页管理
tags: []
fast_fail: false
vars:
  TEST_FILES_DIR: ${PROJECT_ROOT}/tests/at/files/
env_check: []
setup:
- action: session_start
  command: pkill -9 -x deepin-reader || true; sleep 1; rm -rf ~/.local/share/deepin/deepin-reader ~/.config/deepin/deepin-reader ~/.cache/deepin/deepin-reader; deepin-reader ${TEST_FILES_DIR}/normal.pdf ${TEST_FILES_DIR}/1.pdf ${TEST_FILES_DIR}/2.pdf ${TEST_FILES_DIR}/3.pdf ${TEST_FILES_DIR}/4.pdf
  wait: 3.0
suites:
# Case 4.1 添加_多标签页与滚动
- id: suite_tab_add_scroll
  name: 标签页管理 — 添加_多标签页与滚动
  description: 点击新建标签页菜单项和+按钮添加标签页，使用左右滚动按钮滚动标签栏；文件对话框交互不支持自动化
  tags: []
  steps:
  # 主菜单 → 新标签页（触发文件打开对话框）
  - action: dtk_main_menu
    items:
    - 新标签页
    wait: 1.0
  # 文件对话框不支持自动化，按 Escape 关闭
  - action: keyboard_press
    key: escape
    wait: 1.0
  # 点击标签栏右侧+按钮（DTabBarAddButton）
  - action: mouse_click
    ref: n213
    selector:
      name: DTabBarAddButton
      role: button
    wait: 1.0
  # 文件对话框不支持自动化，按 Escape 关闭
  - action: keyboard_press
    key: escape
    wait: 1.0
  # 点击左移按钮（向左滚动）
  - action: mouse_click
    ref: n271
    selector:
      name: 向左滚动
      role: button
    wait: 1.0
  # 点击右移按钮（向右滚动）
  - action: mouse_click
    ref: n272
    selector:
      name: 向右滚动
      role: button
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: n208
    selector:
      name: Form_DocTabBar
      role: form
  - action: assert_element
    ref: n210
    selector:
      name: normal.pdf
      role: page tab
# Case 4.2 关闭_保存提示
- id: suite_tab_close_save
  name: 标签页管理 — 关闭_保存提示
  description: 为文档添加书签使其变为已修改状态，关闭标签页触发保存提示对话框，分别点击保存和不保存
  tags: []
  steps:
  # 展开侧边栏
  - action: mouse_click
    ref: n224
    selector:
      accessible_id: Thumbnails
    wait: 2.0
  # 切换到书签视图
  - action: mouse_click
    ref: n16
    selector:
      accessible_id: bookmark
    wait: 1.0
  # 添加书签使文档变为已修改状态（fileChanged=true）
  - action: mouse_click
    ref: n22
    selector:
      accessible_id: BookmarkAddBtn
    wait: 1.0
  # 点击当前标签页关闭按钮 → 弹出保存提示对话框
  - action: mouse_click
    ref: n273
    selector:
      name: 关闭
      role: push button
    wait: 2.0
  # 点击保存对话框中的"保 存"按钮
  - action: mouse_click
    ref: n274
    selector:
      name: 保 存
      role: push button
    wait: 2.0
  # 在新当前标签页添加书签使其变为已修改状态
  - action: mouse_click
    ref: n22
    selector:
      accessible_id: BookmarkAddBtn
    wait: 1.0
  # 点击当前标签页关闭按钮 → 弹出保存提示对话框
  - action: mouse_click
    ref: n273
    selector:
      name: 关闭
      role: push button
    wait: 2.0
  # 点击保存对话框中的"不保存"按钮
  - action: mouse_click
    ref: n275
    selector:
      name: 不保存
      role: push button
    wait: 2.0
  assert_steps:
  - action: assert_element
    ref: n208
    selector:
      name: Form_DocTabBar
      role: form
  - action: assert_element
    ref: n210
    selector:
      name: normal.pdf
      role: page tab
# Case 4.3 拖拽_排序调整（不支持自动化）
- id: suite_tab_drag_sort
  name: 标签页管理 — 拖拽_排序调整
  description: 长按标签页拖拽调整排序及拖拽至窗口外；AT-SPI 框架无 mouse_drag API，拖拽操作不支持自动化
  tags: []
  steps:
  # 长按标签页拖拽调整排序 — 不支持自动化（无 mouse_drag API）
  - action: unsupported
    reason: AT-SPI 框架无 mouse_drag API，标签页拖拽排序操作不支持自动化
  # 拖拽标签页至窗口外 — 不支持自动化（无 mouse_drag API）
  - action: unsupported
    reason: AT-SPI 框架无 mouse_drag API，拖拽标签页至窗口外不支持自动化
  assert_steps:
  - action: assert_element
    ref: n208
    selector:
      name: Form_DocTabBar
      role: form
# Case 4.4 多窗口_文档互拖（不支持自动化）
- id: suite_tab_multi_window_drag
  name: 标签页管理 — 多窗口_文档互拖
  description: 双击文档打开、拖拽文档至另一窗口及窗口外；AT-SPI 框架无 mouse_drag API，跨窗口拖拽不支持自动化
  tags: []
  steps:
  # 双击另一份文档 — 不支持自动化（无 mouse_double_click/mouse_drag API 用于文件管理器交互）
  - action: unsupported
    reason: AT-SPI 框架无 mouse_drag API，双击文档及跨窗口拖拽操作不支持自动化
  # 拖拽文档至另一窗口 — 不支持自动化
  - action: unsupported
    reason: AT-SPI 框架无 mouse_drag API，拖拽文档至另一窗口不支持自动化
  # 拖拽文档至窗口外 — 不支持自动化
  - action: unsupported
    reason: AT-SPI 框架无 mouse_drag API，拖拽文档至窗口外不支持自动化
  assert_steps:
  - action: assert_element
    ref: n0
    selector:
      name: Form_DMainWindow
      role: form
# Case 4.5 多标签页_搜索独立
- id: suite_tab_search_independent
  name: 标签页管理 — 多标签页_搜索独立
  description: 在不同标签页中独立搜索，点击当前页搜索框关闭按钮仅关闭当前页搜索
  tags: []
  steps:
  # 标签页1：主菜单 → 搜索，打开查找控件
  - action: dtk_main_menu
    items:
    - 搜索
    wait: 1.0
  # 输入搜索关键字
  - action: keyboard_type_text
    text: normal
  - action: keyboard_press
    key: return
    wait: 1.0
  # 切换到另一个标签页
  - action: mouse_click
    ref: n210
    selector:
      name: normal.pdf
      role: page tab
    wait: 1.0
  # 标签页2：主菜单 → 搜索，打开查找控件
  - action: dtk_main_menu
    items:
    - 搜索
    wait: 1.0
  # 输入不同的搜索关键字
  - action: keyboard_type_text
    text: test
  - action: keyboard_press
    key: return
    wait: 1.0
  # 点击当前页搜索框关闭按钮（closeButton）
  - action: mouse_click
    ref: n276
    selector:
      accessible_id: closeButton
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: n243
    selector:
      name: DLineEditChildLineEdit
      role: text
  - action: assert_element
    ref: n257
    selector:
      name: FindPrevButton
      role: button
  - action: assert_element
    ref: n258
    selector:
      name: FindNextButton
      role: button
# Case 4.6 拖拽文档后_功能正常（不支持自动化）
- id: suite_tab_drag_functional
  name: 标签页管理 — 拖拽文档后_功能正常
  description: 拖拽文档至窗口后点击各功能按钮；AT-SPI 框架无 mouse_drag API，拖拽操作不支持自动化
  tags: []
  steps:
  # 拖拽文档至窗口 — 不支持自动化（无 mouse_drag API）
  - action: unsupported
    reason: AT-SPI 框架无 mouse_drag API，拖拽文档至窗口操作不支持自动化
  # 点击各功能按钮 — 拖拽前置条件无法满足，功能验证无法执行
  - action: unsupported
    reason: 拖拽前置条件无法自动化，后续功能验证无法执行
  assert_steps:
  - action: assert_element
    ref: n0
    selector:
      name: Form_DMainWindow
      role: form
# Case 4.7 新窗口_打开文档
- id: suite_tab_new_window_open
  name: 标签页管理 — 新窗口_打开文档
  description: 通过主菜单新建窗口，在新窗口中打开文档；文件对话框交互不支持自动化
  tags: []
  steps:
  # 主菜单 → 新窗口
  - action: dtk_main_menu
    items:
    - 新窗口
    wait: 2.0
  # 新窗口已创建，点击打开文件按钮
  - action: mouse_click
    ref: n6
    selector:
      name: Button_SelectFile
    wait: 1.0
  # 文件对话框不支持自动化，按 Escape 关闭
  - action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: n0
    selector:
      name: Form_DMainWindow
      role: form
teardown:
- action: session_stop
