name: "退出幻灯片播放，应用保持之前的最大化或默认状态"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "最大化窗口"
    action: element_action
    action: element_action
    ref: "title_max_btn"
    do: "click"
  - name: "右键点击文档中心"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击幻灯片放映"
    action: element_action
    action: element_action
    ref: "context_slide_show"
    do: "click"
  - name: "等待幻灯片播放"
    action: wait
    action: wait
    wait_after: 2000
  - name: "按ESC退出"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "esc"
  - name: "验证窗口维持最大化"
    action: wait
    action: wait
    wait_after: 500
teardown:
  - action: session_stop
