name: "关闭按钮"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "添加书签编辑文档"
    action: mouse_click
    action: mouse_click
    ref: "doc_center"
  - name: "右键添加书签"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击添加书签"
    action: element_action
    action: element_action
    ref: "context_add_bookmark"
    do: "click"
  - name: "点击关闭按钮"
    action: element_action
    action: element_action
    ref: "title_close_btn"
    do: "click"
  - name: "等待对话框弹出"
    action: wait
    action: wait
    wait_after: 1000
teardown:
  - action: session_stop
