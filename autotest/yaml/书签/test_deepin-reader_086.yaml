name: 035点击菜单方式添加书签
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档
  4.双页显示

  测试步骤:
  1. 选中文本，点击右键菜单中的“添加书签”菜单，查看
  2. 未选中文本，点击右键菜单中的“添加书签”菜单，查看

  预期结果:
  1. 文本所在页面添加为书签，文档右上角显示蓝色填充色的书签图标，右键菜单中“添加书签”菜单变为“删除书签”
  2. 文本所在页面添加为书签，文档右上角显示蓝色填充色的书签图标，右键菜单中“添加书签”菜单变为“删除书签”
module: 书签
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 右键文档选择添加书签
    action: mouse_right_click
    ref: doc_center
    wait_after: 500
  - name: 选择添加书签
    action: context_menu_comb
    ref: doc_center
    menu: AddBookmark
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
