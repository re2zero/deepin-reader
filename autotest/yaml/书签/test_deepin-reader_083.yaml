name: delete快捷键删除书签缩略图
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档
  4.双页显示

  测试步骤:
  1. 选中一个书签缩略图，鼠标不点击移动至左边栏以外区域，按快捷键delete，查看是否正常删除

  预期结果:
  1. 可以正常删除
module: 书签
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 点击书签按钮
    action: element_action
    ref: sidebar_bookmark_btn
    do: click
    wait_after: 500
  - name: 选中书签缩略图
    action: element_action
    ref: bookmark_list
    do: click
    wait_after: 500
  - name: 按Delete键删除
    action: keyboard_press
    keys: Delete
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
