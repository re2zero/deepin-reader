name: 037打开不同格式
app: deepin-reader
screenshot: false
description: |
  测试步骤:
  1. 分别打开以下支持的文档格式，查看能否正常打开查看：
  PDF（扫描件和非扫描件格式）， DJVU, DOCX格式文档

  预期结果:
  1. 支持的格式文档均可以正常打开浏览
module: 书签
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 打开PDF文档验证
    action: element_action
    ref: doc_view
    do: click
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
