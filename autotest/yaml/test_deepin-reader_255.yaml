name: "同时打开三种格式文档"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "按Ctrl+O打开文件选择"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择三种格式文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档.pdf /home/uos/文档.djvu /home/uos/文档.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待所有文档加载"
    action: wait
    action: wait
    wait: 8.0
  - name: "验证标签栏显示多个标签页"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "验证当前文档视图显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "通过新标签页菜单打开三种格式"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_tab
  - name: "等待菜单响应"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档2.pdf /home/uos/文档2.djvu /home/uos/文档2.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 8.0
  - name: "验证更多标签页添加"
    action: element_visible
    action: element_visible
    ref: tab_bar

teardown:
  - action: session_stop
