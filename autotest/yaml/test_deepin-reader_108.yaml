name: "多种打开方式"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "按Ctrl+O打开文件"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
    wait_after: 1000

  - name: "关闭对话框"
    action: keyboard_press
    action: keyboard_press
    keys: "Escape"
    wait_after: 500

teardown:
  - action: session_stop
