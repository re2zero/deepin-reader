name: "点击注释目录"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击左侧栏注释条目"
    action: element_action
    action: element_action
    ref: annotation_list
    do: "click"
    wait_after: 500
  - name: "验证跳转到对应页面"
    action: wait
    wait: 0
    assert:
      - type: element_visible
        ref: doc_view

teardown:
  - action: session_stop
