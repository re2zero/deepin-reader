name: "18、视图保持_修改页面视图后在多窗口打开调整过页面视图的文档"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "调整页面视图C为300%"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "输入300"
    action: keyboard_type
    action: keyboard_type
    text: "300"
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "在新窗口打开文档"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_window
  - name: "等待"
    action: wait
    action: wait
    wait: 2.0

teardown:
  - action: session_stop
