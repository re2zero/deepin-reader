name: "删除高亮注释方式"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键高亮文本选择取消高亮"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_selected_text
    wait_after: 500

  - name: "选择取消高亮"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_selected_text
    menu: "RemoveHighlight"
    wait_after: 500

teardown:
  - action: session_stop
