name: "发送文档保留注释"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "添加高亮注释"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_center
    wait_after: 500

  - name: "选择添加高亮"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddTextHighlight"
    wait_after: 500

  - name: "保存文档"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_save
    wait_after: 500

teardown:
  - action: session_stop
