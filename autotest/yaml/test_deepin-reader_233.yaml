name: "焦点切换，直接跳过置灰菜单"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "选中文本区域"
    action: mouse_click
    action: mouse_click
    ref: "doc_selected_text"
  - name: "右键点击选中区域"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_selected_text"
  - name: "按上下键切换焦点"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "down"
  - name: "继续切换"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "down"
  - name: "按ESC退出"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "esc"
teardown:
  - action: session_stop
