name: "默认选中橘黄色高亮"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 2.0
  - name: "选中多行文本右击"
    action: mouse_drag
    action: mouse_drag
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "右击查看默认颜色"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_selected_text
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按Esc关闭菜单"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
