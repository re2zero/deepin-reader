name: "[038]全屏显示后1秒内呼唤/隐藏出工具栏"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "鼠标移到窗口顶端呼唤工具栏"
    action: mouse_click
    action: mouse_click
    ref: fullscreen_toolbar
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "鼠标移出工具栏区域"
    action: mouse_click
    action: mouse_click
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 2.0

teardown:
  - action: session_stop
