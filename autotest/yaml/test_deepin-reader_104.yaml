name: "单个窗口初始界面添加多标签页方式"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "验证初始界面无标签页"
    action: element_visible
    action: element_visible
    ref: main_window
  - name: "方式1：通过Ctrl+O添加文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择多个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档1.pdf /home/uos/文档2.djvu"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证多个标签页显示"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "方式2：通过菜单新标签页添加"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_tab
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档3.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证更多标签页添加"
    action: element_visible
    action: element_visible
    ref: tab_bar

teardown:
  - action: session_stop
