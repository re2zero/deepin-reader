name: "多个标签页的显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开第一个PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择第一个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "通过新标签页添加第二个文档"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_tab
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择第二个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档2.djvu"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "通过+按钮添加第三个文档"
    action: element_action
    action: element_action
    ref: tab_add_btn
    do: "click"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择第三个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档3.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载转化"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证标签栏显示多个标签页"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "验证新添加的标签页高亮"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
