name: "1、最小尺寸_检查"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证主窗口显示"
    action: element_visible
    action: element_visible
    ref: main_window
  - name: "验证文档视图显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "验证工具栏元素可见"
    action: element_visible
    action: element_visible
    ref: zoom_combo
  - name: "打开新窗口检查默认尺寸"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_window
  - name: "等待新窗口"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证新窗口各元素无遮挡"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
