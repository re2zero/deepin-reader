name: "关闭再打开文档记住所在页数和左边栏状态"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "展开左边栏"
    action: element_action
    action: element_action
    ref: sidebar_toggle_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击页数输入框跳转到第5页"
    action: element_set_value
    action: element_set_value
    ref: page_input
    text: "5"
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
