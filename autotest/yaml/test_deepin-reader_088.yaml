name: "窗口比例变化和左边栏宽度变化"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "展开左边栏"
    action: element_action
    action: element_action
    ref: sidebar_toggle_btn
    do: "click"
  - name: "等待侧边栏展开"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证侧边栏可见"
    action: element_visible
    action: element_visible
    ref: sidebar
  - name: "最大化窗口"
    action: element_action
    action: element_action
    ref: title_max_btn
    do: "click"
  - name: "等待最大化"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证左边栏和文档区域比例显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "恢复窗口大小"
    action: element_action
    action: element_action
    ref: title_max_btn
    do: "click"
  - name: "等待恢复"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证调整后界面显示正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
