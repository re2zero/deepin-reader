name: "多个英文或中文关键字均可以正常搜索到"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "输入英文关键字user搜索"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "输入user"
    action: keyboard_type
    action: keyboard_type
    text: user
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "点击搜索上一个"
    action: element_action
    action: element_action
    ref: search_prev_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击搜索下一个"
    action: element_action
    action: element_action
    ref: search_next_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "清除关键字输入中文"
    action: element_set_value
    action: element_set_value
    ref: search_input
    text: 
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "输入中文关键字系统"
    action: keyboard_type
    action: keyboard_type
    text: 系统
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "点击搜索上一个"
    action: element_action
    action: element_action
    ref: search_prev_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击搜索下一个"
    action: element_action
    action: element_action
    ref: search_next_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
