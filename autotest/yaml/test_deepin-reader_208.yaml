name: "搜索框界面"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "按Ctrl+F打开搜索"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,f"
  - name: "按Tab键切换搜索按钮"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter执行"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "继续Tab切换"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter执行"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "关闭搜索"
    action: element_action
    action: element_action
    ref: "search_close_btn"
    do: "click"
teardown:
  - action: session_stop
