name: "放大缩小文档，过程流畅，无闪烁"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "点击放大按钮"
    action: element_action
    action: element_action
    ref: zoom_in_btn
    do: "click"
  - name: "等待放大"
    action: wait
    action: wait
    wait: 1.0
  - name: "再次点击放大按钮"
    action: element_action
    action: element_action
    ref: zoom_in_btn
    do: "click"
  - name: "等待放大"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证文档视图正常"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "点击缩小按钮"
    action: element_action
    action: element_action
    ref: zoom_out_btn
    do: "click"
  - name: "等待缩小"
    action: wait
    action: wait
    wait: 1.0
  - name: "再次点击缩小按钮"
    action: element_action
    action: element_action
    ref: zoom_out_btn
    do: "click"
  - name: "等待缩小"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证文档视图正常"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "使用Ctrl+=放大"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,="
  - name: "等待放大"
    action: wait
    action: wait
    wait: 1.0
  - name: "使用Ctrl+-缩小"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,-"
  - name: "等待缩小"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证文档视图显示正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
