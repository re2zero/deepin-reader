name: "[015]取消高亮"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 2.0
  - name: "选中文本添加高亮"
    action: mouse_drag
    action: mouse_drag
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "右击添加高亮"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_selected_text
    menu: ["Highlight"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "右击高亮文本取消高亮"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_selected_text
    menu: ["Remove highlight"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
