name: "不改变文件名保存替换界面，弹出对话框"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击保存"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_save"
  - name: "按Tab键切换焦点"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter确认替换"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "按ESC取消"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "esc"
teardown:
  - action: session_stop
