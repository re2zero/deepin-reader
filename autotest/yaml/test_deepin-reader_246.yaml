name: "翻页，页面显示流畅"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "鼠标滚轮向下翻页"
    action: mouse_scroll
    action: mouse_scroll
    amount: -3
  - name: "等待翻页"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证文档视图正常"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "鼠标滚轮向上翻页"
    action: mouse_scroll
    action: mouse_scroll
    amount: 3
  - name: "等待翻页"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证文档视图正常"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "拖拽垂直滚动条翻页"
    action: element_action
    action: element_action
    ref: doc_scrollbar_v
    do: "click"
  - name: "等待翻页"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证页面显示流畅"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "拖拽水平滚动条"
    action: element_action
    action: element_action
    ref: doc_scrollbar_h
    do: "click"
  - name: "等待翻页"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证页面显示正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
