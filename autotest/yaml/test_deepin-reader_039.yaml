name: "编辑后进行另存"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击文档区域"
    action: mouse_click
    action: mouse_click
    ref: "doc_center"
  - name: "添加高亮注释"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击主菜单"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_save_as"
  - name: "等待另存对话框"
    action: wait
    action: wait
    wait_after: 1000
teardown:
  - action: session_stop
