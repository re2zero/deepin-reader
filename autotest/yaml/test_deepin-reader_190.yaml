name: "快捷键编辑注释内容"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开注释编辑窗口输入内容"
    action: mouse_click
    action: mouse_click
    ref: doc_annotation_icon
    wait_after: 500

  - name: "按Ctrl+A全选"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,a"
    wait_after: 500

  - name: "按Ctrl+C复制"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,c"
    wait_after: 500

  - name: "按Ctrl+V粘贴"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,v"
    wait_after: 500

  - name: "按Ctrl+X剪切"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,x"
    wait_after: 500

  - name: "按Ctrl+Z撤销"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,z"
    wait_after: 500

  - name: "按Ctrl+S保存"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,s"
    wait_after: 500

  - name: "按Delete删除"
    action: keyboard_press
    action: keyboard_press
    keys: "Delete"
    wait_after: 500

teardown:
  - action: session_stop
