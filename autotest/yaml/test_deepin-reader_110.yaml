name: "使用放大镜"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击主菜单开启放大镜"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_magnifer"
  - name: "移动鼠标到文档区域"
    action: mouse_click
    action: mouse_click
    ref: "doc_center"
  - name: "等待放大效果"
    action: wait
    action: wait
    wait_after: 1000
teardown:
  - action: session_stop
