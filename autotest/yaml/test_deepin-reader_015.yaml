name: "上下页面均有一部分显示在当前窗口时，未选中文本右击弹出菜单"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键点击文档中心区域"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击第一页"
    action: element_action
    action: element_action
    ref: "context_first_page"
    do: "click"
  - name: "等待页面跳转"
    action: wait
    action: wait
    wait_after: 500
  - name: "右键点击文档中心"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击前一页"
    action: element_action
    action: element_action
    ref: "context_prev_page"
    do: "click"
  - name: "右键点击文档中心"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击后一页"
    action: element_action
    action: element_action
    ref: "context_next_page"
    do: "click"
  - name: "右键点击文档中心"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击最后一页"
    action: element_action
    action: element_action
    ref: "context_last_page"
    do: "click"
teardown:
  - action: session_stop
