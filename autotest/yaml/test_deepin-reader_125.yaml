name: "视图调整菜单"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "选择35%百分比"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "输入35"
    action: keyboard_type
    action: keyboard_type
    text: "35"
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击适合宽度"
    action: element_action
    action: element_action
    ref: fit_to_width_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击适合高度"
    action: element_action
    action: element_action
    ref: fit_to_height_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "左旋转"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Rotate left"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "右旋转"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Rotate right"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
