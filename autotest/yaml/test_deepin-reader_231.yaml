name: "最小化窗口后，双击其他文档重新打开窗口"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证文档显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "点击最小化按钮"
    action: element_action
    action: element_action
    ref: title_min_btn
    do: "click"
  - name: "等待窗口最小化"
    action: wait
    action: wait
    wait: 2.0
  - name: "验证进程仍在运行"
    action: process_running
    action: process_running
    ref: deepin-reader
  - name: "通过文件管理器双击另一文档"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待窗口恢复"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证新文档在窗口中打开"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
