name: "单个窗口中多标签页管理"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开多个文档直到标签超出范围"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择多个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档1.pdf /home/uos/文档2.pdf /home/uos/文档3.pdf /home/uos/文档4.pdf /home/uos/文档5.pdf /home/uos/文档6.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待所有文档加载"
    action: wait
    action: wait
    wait: 8.0
  - name: "验证标签栏显示"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "点击左侧翻页按钮"
    action: element_action
    action: element_action
    ref: tab_bar
    do: "click"
  - name: "等待滚动"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击右侧翻页按钮"
    action: element_action
    action: element_action
    ref: tab_bar
    do: "click"
  - name: "等待滚动"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证界面显示正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
