name: "打开多途径获取的PDF、DOCX文档"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: element_action
    action: element_action
    ref: doc_view
    do: "click"
    wait_after: 1000

  - name: "验证进程运行"
    action: wait
    wait: 0
    assert:
      - type: process_running
        app: "deepin-reader"

teardown:
  - action: session_stop
