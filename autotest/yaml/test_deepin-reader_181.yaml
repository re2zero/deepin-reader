name: "适应宽度后收起再展开左侧栏"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "固定显示侧边栏"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击适合宽度"
    action: element_action
    action: element_action
    ref: fit_to_width_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "收起再展开侧边栏"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "再次展开"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
