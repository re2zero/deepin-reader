name: "选中高亮注释文本进行复制"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "选中高亮文本区域"
    action: mouse_click
    action: mouse_click
    ref: "doc_selected_text"
  - name: "右键点击选中文本"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_selected_text"
  - name: "点击复制"
    action: element_action
    action: element_action
    ref: "context_copy"
    do: "click"
  - name: "右键点击选中文本"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_selected_text"
  - name: "取消高亮"
    action: element_action
    action: element_action
    ref: "context_remove_highlight"
    do: "click"
teardown:
  - action: session_stop
