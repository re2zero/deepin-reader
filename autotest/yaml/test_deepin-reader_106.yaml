name: "036关闭再打开"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "关闭应用"
    action: session_stop
    action: session_stop
    wait_after: 1000

  - name: "重新启动"
    action: session_start
    action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

teardown:
  - action: session_stop
