name: 退出幻灯片播放，应用保持之前的最大化或默认状态
app: deepin-reader
screenshot: false
description: |
  测试步骤:
  1. 打开文档，点击最大化
  2. 右击主视图界面弹出右键菜单，点击幻灯片播放菜单
  3. 点击底部按钮的X键，或键盘ESC键
  4. 打开文档，查看默认状态
  5. 右击主视图界面弹出右键菜单，点击幻灯片播放菜单
  6. 点击底部按钮的X键，或键盘ESC键

  预期结果:
  1. 应用最大化显示
  2. 进入幻灯片播放
  3. 退出幻灯片播放，应用窗口保持最大化显示
  4. 窗口为默认大小
  5. 进入幻灯片播放
  6. 退出幻灯片播放，应用窗口保持默认大小
module: 右键菜单
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 最大化窗口
    action: element_action
    ref: title_max_btn
    do: click
  - name: 右键点击文档中心
    action: context_menu_comb
    ref: doc_center
  - name: 点击幻灯片放映
    action: element_action
    ref: context_slide_show
    do: click
  - name: 等待幻灯片播放
    action: wait
    wait_after: 2000
  - name: 按ESC退出
    action: keyboard_hot_key
    keys: esc
  - name: 验证窗口维持最大化
    action: wait
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
