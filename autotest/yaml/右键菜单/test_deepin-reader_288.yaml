name: 打印预览显示正常
app: deepin-reader
screenshot: false
description: |
  测试步骤:
  1. 打开横向显示的PDF格式文档（可以通过ppt转化）
  2. 点击打印，进入打印预览界面，查看预览图片的显示
  3. 打开普通纵向显示的PDF格式文档
  4. 点击打印，进入打印预览界面，查看预览图片的显示

  预期结果:
  1. 界面内容显示正常
  2. 正常横向显示，不会被纵向拉伸
  3. 界面内容显示正常
  4. 显示正常
module: 右键菜单
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 右键点击文档中心
    action: context_menu_comb
    ref: doc_center
  - name: 点击打印
    action: element_action
    ref: context_print
    do: click
  - name: 等待打印预览
    action: wait
    wait_after: 2000
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
