name: "鼠标放置在屏幕顶端或左侧边缘，按快捷键F11，工具栏和左侧栏正常弹出可点击"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "最大化显示"
    action: element_action
    action: element_action
    ref: title_max_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "鼠标放顶端按F11"
    action: mouse_click
    action: mouse_click
    ref: fullscreen_toolbar
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按F11"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 2.0

teardown:
  - action: session_stop
