name: "单个窗口中打开多个标签页（仅包含docx）全部未编辑，关闭或退出"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开多个docx文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择三个docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档1.docx /home/uos/文档2.docx /home/uos/文档3.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待所有文档加载"
    action: wait
    action: wait
    wait: 8.0
  - name: "验证标签栏显示三个标签页"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "点击关闭按钮"
    action: element_action
    action: element_action
    ref: title_close_btn
    do: "click"
  - name: "等待窗口关闭"
    action: wait
    action: wait
    wait: 2.0
  - name: "验证应用已退出（无编辑无保存提示）"
    action: process_not_running
    action: process_not_running
    ref: deepin-reader

teardown:
  - action: session_stop
