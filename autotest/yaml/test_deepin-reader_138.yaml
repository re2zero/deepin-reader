# YAML test case for deepin-reader — 压力/138 "批量添加注释"
# AUTOMATABLE: Add multiple annotations via context menu on document.
# Tests 3 annotations as representative sample of 100+ stress test.

name: "压力/138 批量添加注释"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

  - action: keyboard_hot_key
    key: "ctrl+o"
    wait: 2.0

  - action: keyboard_hot_key
    key: "ctrl+l"
    wait: 0.5

  - action: keyboard_type
    text: "/home/uos/test/files/1.pdf"
    wait: 0.5

  - action: keyboard_press
    key: "Return"
    wait: 2.0

steps:
  - name: "右键文档添加高亮注释 #1"
    action: element_action
    action: element_action
    ref: doc_center
    do: "rightClick"
    wait: 0.5
    assert:
      - type: element_visible
        selector:
          role: "drawing area"
          name: "document"

  - name: "选择添加高亮注释菜单"
    action: context_menu_comb
    action: context_menu_comb
    ref: context_add_annotation_hl
    wait: 1.0
    assert:
      - type: element_visible
        selector:
          role: "drawing area"
          name: "document"

  - name: "右键文档添加图标注释 #2"
    action: element_action
    action: element_action
    ref: doc_center
    do: "rightClick"
    wait: 0.5

  - name: "选择添加图标注释菜单"
    action: context_menu_comb
    action: context_menu_comb
    ref: context_add_annotation
    wait: 1.0

  - name: "右键文档添加高亮注释 #3"
    action: element_action
    action: element_action
    ref: doc_center
    do: "rightClick"
    wait: 0.5

  - name: "选择添加高亮注释菜单"
    action: context_menu_comb
    action: context_menu_comb
    ref: context_add_annotation_hl
    wait: 1.0

  - name: "打开左侧栏注释列表"
    action: element_action
    action: element_action
    ref: sidebar_annotation_btn
    do: "click"
    wait: 1.0

  - name: "验证注释列表可见"
    action: wait
    wait: 0
    assert:
      - type: element_visible
        selector:
          role: "list"
          name: "annotation"

teardown:
  - action: session_stop
