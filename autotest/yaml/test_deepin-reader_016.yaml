name: "多次搜索"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "打开搜索"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "输入关键字并搜索"
    action: keyboard_type
    action: keyboard_type
    text: document
  - name: "按Enter搜索"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "删除关键字"
    action: element_set_value
    action: element_set_value
    ref: search_input
    text: 
  - name: "输入新关键字并搜索"
    action: keyboard_type
    action: keyboard_type
    text: page
  - name: "按Enter搜索"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "点击搜索上一步"
    action: element_action
    action: element_action
    ref: search_prev_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击搜索下一步"
    action: element_action
    action: element_action
    ref: search_next_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
