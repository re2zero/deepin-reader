name: "文档拖拽后各功能正常"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证功能1：双页显示"
    action: element_action
    action: element_action
    ref: double_page_btn
    do: "click"
  - name: "等待调整"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证功能2：适应高度"
    action: element_action
    action: element_action
    ref: fit_to_height_btn
    do: "click"
  - name: "等待调整"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证功能3：适应宽度"
    action: element_action
    action: element_action
    ref: fit_to_width_btn
    do: "click"
  - name: "等待调整"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证功能4：右键旋转"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "RotateRight"
  - name: "等待旋转"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证功能5：翻页操作"
    action: mouse_scroll
    action: mouse_scroll
    amount: -3
  - name: "等待翻页"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证功能6：菜单功能-保存"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_save
  - name: "等待保存"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证功能7：菜单-打印"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_print
  - name: "等待打印对话框"
    action: wait
    action: wait
    wait: 1.0
  - name: "取消打印"
    action: keyboard_press
    action: keyboard_press
    keys: "Escape"
  - name: "验证所有功能正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
