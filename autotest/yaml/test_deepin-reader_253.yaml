name: "选中多个docx文档，右击打开"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开文件对话框"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择多个docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档1.docx /home/uos/文档2.docx /home/uos/文档3.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待所有文档加载转化"
    action: wait
    action: wait
    wait: 8.0
  - name: "验证标签栏显示多个标签页"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "验证每个标签页对应一个文档"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
