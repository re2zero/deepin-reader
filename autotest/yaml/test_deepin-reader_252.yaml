name: "docx文档打开方式"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "方式4：点击选择文件打开docx"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载转化"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证docx文档显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "方式5：Ctrl+O打开docx"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择另一个docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档2.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证新标签页打开"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "方式6：通过菜单新标签页打开docx"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_tab
  - name: "等待菜单响应"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档3.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证三个标签页显示"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "方式7：点击标签栏+按钮"
    action: element_action
    action: element_action
    ref: tab_add_btn
    do: "click"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档4.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证四个标签页显示"
    action: element_visible
    action: element_visible
    ref: tab_bar

teardown:
  - action: session_stop
