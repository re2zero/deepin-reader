name: "ctrl1、ctrl2、ctrl3快捷键切换规则"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 2.0
  - name: "切换到双页显示"
    action: element_action
    action: element_action
    ref: double_page_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按Ctrl1恢复实际大小"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: ctrl,1
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按Ctrl2适应高度"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: ctrl,2
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按Ctrl3适应宽度"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: ctrl,3
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "分别按Ctrl1/Ctrl2/Ctrl3切换"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: ctrl,1
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按Ctrl2"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: ctrl,2
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按Ctrl3"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: ctrl,3
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
