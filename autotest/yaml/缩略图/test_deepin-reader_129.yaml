name: 缩略图标
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.分别打开PDF和DJVU文档测试
  2. 打开docx文档

  测试步骤:
  1. 点击顶端工具栏中缩略图标，查看界面显示
  2. 分别点击目录图标、书签图标和注释图标，查看界面显示
  3. 再次点击顶端工具栏中缩略图标

  预期结果:
  1. 左边栏底部显示四个图标：缩略图图标、目录图标、书签图标和注释图标
  2. 左边栏显示相应缩略图页面，页面显示正常
  3. 会取消高亮，隐藏左边栏和缩略图内容
module: 缩略图
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 点击工具栏缩略图图标
    action: element_action
    ref: sidebar_thumbnail_btn
    do: click
    wait_after: 500
  - name: 点击目录图标
    action: element_action
    ref: sidebar_catalog_btn
    do: click
    wait_after: 500
  - name: 点击书签图标
    action: element_action
    ref: sidebar_bookmark_btn
    do: click
    wait_after: 500
  - name: 点击注释图标
    action: element_action
    ref: sidebar_annotation_btn
    do: click
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
