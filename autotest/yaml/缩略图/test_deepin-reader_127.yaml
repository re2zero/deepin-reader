name: 文档缩略图显示内容
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开PDF文档测试
  2. 打开docx文档

  测试步骤:
  1. 打开文档，查看文档缩略图默认显示内容
  2. 文档中添加高亮、书签、注释，查看左边栏文档缩略图中是否显示
  3. 删除高亮、书签、注释，查看左边栏文档缩略图中是否显示

  预期结果:
  1. 显示所有页面缩略图
  2. 文档缩略图中正常显示高亮、书签图标、注释图标
  3. 删除的高亮、书签图标、注释图标，文档缩略图也会删除
module: 缩略图
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 展开左边栏
    action: element_action
    ref: sidebar_toggle_btn
    do: click
    wait_after: 500
  - name: 点击缩略图按钮
    action: element_action
    ref: sidebar_thumbnail_btn
    do: click
    wait_after: 500
  - name: 验证缩略图列表显示
    action: wait
    wait: 0
    assert:
      - type: element_visible
        ref: thumbnail_list
teardown:
  - action: session_stop
