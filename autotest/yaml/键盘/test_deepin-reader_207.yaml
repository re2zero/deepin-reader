name: 不改变文件名保存替换界面，弹出对话框
app: deepin-reader
screenshot: false
description: "前置条件:\n1.打开pdf格式文档\n2.打开djvu格式文档\n3.打开docx格式文档\n\n测试步骤:\n1. 不改变文件名保存替换\n\
  2. 对话框界面按tab键切换\n3. 按回车键\n4. 选中任意按钮时按esc键\n\n预期结果:\n1. \n2. 可以在对话框界面循环切换，focus效果正确\n\
  3. 执行选中的按钮\n4. 关闭对话框\n"
module: 键盘
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 点击保存
    action: main_menu_comb
    ref: menu_save
  - name: 按Tab键切换焦点
    action: keyboard_hot_key
    keys: tab
  - name: 按Enter确认替换
    action: keyboard_hot_key
    keys: enter
  - name: 按ESC取消
    action: keyboard_hot_key
    keys: esc
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
