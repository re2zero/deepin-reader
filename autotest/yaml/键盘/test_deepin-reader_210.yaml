name: 在文件管理器显示界面
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 在文件管理器显示弹出，按tab键切换
  2. 按回车键

  预期结果:
  1. 循环切换，focus效果正确
  2. 执行选中的按钮
module: 键盘
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 点击菜单键选择在文件管理器显示
    action: main_menu_comb
    ref: menu_display_in_fm
  - name: 按Tab键切换焦点
    action: keyboard_hot_key
    keys: tab
  - name: 按Enter执行
    action: keyboard_hot_key
    keys: enter
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
