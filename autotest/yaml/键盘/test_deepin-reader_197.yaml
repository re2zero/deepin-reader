name: 主菜单下拉界面
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. tab键选中主菜单，按enter或空格键
  2. 按上下方向键
  3. 按enter或空格键
  4. 按左右方向键
  5. 选中任意菜单时按esc键

  预期结果:
  1. 下拉菜单界面弹出
  2. 切换选中菜单，选中效果正确
  3. 执行选择
  4. 按左方向键收起子菜单，按右方向键展开子菜单
  5. 退出菜单，返回到主菜单按钮的选中
module: 键盘
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: Tab键切换到主菜单
    action: keyboard_hot_key
    keys: tab
  - name: 按Enter打开菜单
    action: keyboard_hot_key
    keys: enter
  - name: 按上下方向键切换
    action: keyboard_hot_key
    keys: down
  - name: 按Enter选择
    action: keyboard_hot_key
    keys: enter
  - name: 按ESC退出
    action: keyboard_hot_key
    keys: esc
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
