name: 百分比输入框下拉菜单界面
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. tab键选中百分比输入框的下拉按钮，按enter或空格键
  2. 按上下方向键
  3. 按enter或空格键
  4. 选中任意菜单时按esc键

  预期结果:
  1. 下拉菜单界面弹出
  2. 切换选中菜单，选中效果正确
  3. 执行选择
  4. 退出菜单，返回到百分比输入框的选中
module: 键盘
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: Tab键切换到百分比框
    action: keyboard_hot_key
    keys: tab
  - name: 按Enter打开下拉
    action: keyboard_hot_key
    keys: enter
  - name: 按上下方向键切换
    action: keyboard_hot_key
    keys: down
  - name: 按Enter选择
    action: keyboard_hot_key
    keys: enter
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
