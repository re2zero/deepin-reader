name: 左侧栏目录上下切换与删除
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 文档缩略图界面，按上下方向键或pageup、pagedown
  2. 目录界面，按上下方向键或pageup、pagedown
  3. 书签目录界面，按上下方向键或pageup、pagedown，delete键
  4. 注释目录界面，按上下方向键或pageup、pagedown，delete键

  预期结果:
  1. 正确切换
  2. 正确切换
  3. 正确切换，正常删除
  4. 正确切换，正常删除
module: 键盘
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 打开缩略图栏
    action: element_action
    ref: sidebar_thumbnail_btn
    do: click
  - name: 按上下方向键切换
    action: keyboard_hot_key
    keys: down
  - name: 按PageDown翻页
    action: keyboard_hot_key
    keys: pagedown
  - name: 切换到书签栏
    action: element_action
    ref: sidebar_bookmark_btn
    do: click
  - name: 按Delete删除
    action: keyboard_hot_key
    keys: delete
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
