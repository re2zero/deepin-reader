name: "删除所有书签"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键书签目录"
    action: mouse_right_click
    action: mouse_right_click
    ref: bookmark_list
    wait_after: 500

  - name: "选择删除所有书签"
    action: context_menu_comb
    action: context_menu_comb
    ref: bookmark_list
    menu: "RemoveBookmark"
    wait_after: 500

  - name: "确认删除"
    action: element_action
    action: element_action
    ref: dialog_confirm
    do: "click"
    wait_after: 500

teardown:
  - action: session_stop
