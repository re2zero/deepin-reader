name: "百分比输入框下拉菜单界面"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "Tab键切换到百分比框"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter打开下拉"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "按上下方向键切换"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "down"
  - name: "按Enter选择"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
teardown:
  - action: session_stop
