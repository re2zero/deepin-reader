name: "[002]帮助"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "按F1打开帮助"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "f1"
  - name: "等待帮助页面"
    action: wait
    action: wait
    wait_after: 2000
teardown:
  - action: session_stop
