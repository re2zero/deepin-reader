name: "左侧栏目录上下切换与删除"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开缩略图栏"
    action: element_action
    action: element_action
    ref: "sidebar_thumbnail_btn"
    do: "click"
  - name: "按上下方向键切换"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "down"
  - name: "按PageDown翻页"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "pagedown"
  - name: "切换到书签栏"
    action: element_action
    action: element_action
    ref: "sidebar_bookmark_btn"
    do: "click"
  - name: "按Delete删除"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "delete"
teardown:
  - action: session_stop
