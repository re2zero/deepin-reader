name: "编辑高亮注释"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "单击高亮注释"
    action: mouse_click
    action: mouse_click
    ref: doc_selected_text
    wait_after: 500

  - name: "输入注释内容"
    action: keyboard_type
    action: keyboard_type
    text: "编辑高亮注释内容"
    wait_after: 500

  - name: "点击其他区域完成编辑"
    action: mouse_click
    action: mouse_click
    ref: doc_center
    wait_after: 500

teardown:
  - action: session_stop
