name: 幻灯片播放时全屏展示播放
app: deepin-reader
screenshot: false
description: "前置条件:\n1.打开文档查看器\n2.依次打开PDF，DJVU，DOCX\n\n测试步骤:\n1. 在任意位置右击\n2. 点击幻灯片放映\n\
  \n预期结果:\n1. \n2. 进入幻灯片播放，播放内容不会进行拉伸，顶格展示\n"
module: 社区需求
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 打开PDF文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择文档
    action: keyboard_type
    text: /home/uos/幻灯片文档.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 在文档区域右击弹出菜单
    action: context_menu_comb
    ref: doc_center
    menu: SlideShow
  - name: 等待幻灯片启动
    action: wait
    wait: 3.0
  - name: 验证幻灯片窗口显示
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: window
  - name: 验证全屏工具栏显示
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: tool bar
  - name: 验证幻灯片内容顶格展示
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: window
teardown:
  - action: keyboard_press
    keys: Escape
  - action: wait
    wait: 1.0
  - action: session_stop
