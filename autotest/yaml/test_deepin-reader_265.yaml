name: "打开多个窗口，窗口A中点击关于并关闭，再点击窗口B中的关于无异常"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开新窗口"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_new_window"
  - name: "等待新窗口打开"
    action: wait
    action: wait
    wait_after: 2000
  - name: "在窗口A打开关于"
    action: element_action
    action: element_action
    ref: "title_option_btn"
    do: "click"
  - name: "关闭窗口A"
    action: element_action
    action: element_action
    ref: "title_close_btn"
    do: "click"
  - name: "在窗口B打开关于"
    action: element_action
    action: element_action
    ref: "title_option_btn"
    do: "click"
teardown:
  - action: session_stop
