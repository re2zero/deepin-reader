name: "左边栏底部按钮功能"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "展开左边栏"
    action: element_action
    action: element_action
    ref: sidebar_toggle_btn
    do: "click"
    wait_after: 500

  - name: "点击缩略图图标"
    action: element_action
    action: element_action
    ref: sidebar_thumbnail_btn
    do: "click"
    wait_after: 500

  - name: "验证缩略图列表可见"
    action: wait
    wait: 0
    assert:
      - type: element_visible
        ref: thumbnail_list

  - name: "点击目录图标"
    action: element_action
    action: element_action
    ref: sidebar_catalog_btn
    do: "click"
    wait_after: 500

  - name: "点击书签图标"
    action: element_action
    action: element_action
    ref: sidebar_bookmark_btn
    do: "click"
    wait_after: 500

  - name: "点击注释图标"
    action: element_action
    action: element_action
    ref: sidebar_annotation_btn
    do: "click"
    wait_after: 500

teardown:
  - action: session_stop
