# YAML test case for deepin-reader — 触摸板/216 "单指双击"
# AUTOMATABLE: Single-finger double-tap on titlebar = double-click with mouse.
# Same simulation as 触摸屏/221 — uses mouse_double_click on titlebar area.

name: "触摸板/216 单指双击"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "双击标题栏 — 窗口最大化"
    action: element_action
    action: element_action
    ref: title_option_btn
    do: "doubleClick"
    wait: 1.0

  - name: "验证进程运行中"
    action: wait
    wait: 0
    assert:
      - type: process_running
        app: "deepin-reader"

  - name: "再次双击标题栏 — 恢复窗口大小"
    action: element_action
    action: element_action
    ref: title_option_btn
    do: "doubleClick"
    wait: 1.0

  - name: "验证进程运行中"
    action: wait
    wait: 0
    assert:
      - type: process_running
        app: "deepin-reader"

teardown:
  - action: session_stop
