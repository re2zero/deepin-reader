name: "幻灯片放映"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键点击文档中心"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击幻灯片放映"
    action: element_action
    action: element_action
    ref: "context_slide_show"
    do: "click"
  - name: "等待幻灯片播放"
    action: wait
    action: wait
    wait_after: 2000
  - name: "按下ESC退出"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "esc"
teardown:
  - action: session_stop
