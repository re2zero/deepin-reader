name: "单个窗口中多标签页管理"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开多个文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择多个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档1.pdf /home/uos/文档2.pdf /home/uos/文档3.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待所有文档加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证多个标签页"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "在标签页1中进行搜索"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待搜索栏"
    action: wait
    action: wait
    wait: 1.0
  - name: "输入搜索关键词"
    action: keyboard_type
    action: keyboard_type
    text: "test"
  - name: "等待搜索结果"
    action: wait
    action: wait
    wait: 1.0
  - name: "切换至另一个标签页"
    action: element_action
    action: element_action
    ref: tab_bar
    do: "click"
  - name: "等待切换"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证切换正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
