name: "035点击菜单方式添加书签"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键文档选择添加书签"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_center
    wait_after: 500

  - name: "选择添加书签"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddBookmark"
    wait_after: 500

teardown:
  - action: session_stop
