name: "输入图标注释达到上限"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键添加注释"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_center
    wait_after: 500

  - name: "选择添加注释图标"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddAnnotationIcon"
    wait_after: 500

  - name: "输入超长内容"
    action: keyboard_type
    action: keyboard_type
    text: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    wait_after: 500

teardown:
  - action: session_stop
