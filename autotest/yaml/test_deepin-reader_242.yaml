name: "快捷键切换注释目录"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "添加多个注释后点击注释按钮"
    action: element_action
    action: element_action
    ref: sidebar_annotation_btn
    do: "click"
    wait_after: 500

  - name: "选中一个注释目录"
    action: element_action
    action: element_action
    ref: annotation_list
    do: "click"
    wait_after: 500

  - name: "按向下键切换"
    action: keyboard_press
    action: keyboard_press
    keys: "Down"
    wait_after: 500

teardown:
  - action: session_stop
