name: "快速滑动页面"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "快速向下滚动页面"
    action: mouse_scroll
    action: mouse_scroll
    amount: -5
  - name: "等待界面刷新"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证文档视图正常"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "快速向上滚动页面"
    action: mouse_scroll
    action: mouse_scroll
    amount: 5
  - name: "等待界面刷新"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证文档视图正常"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "调整缩放为10%"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: "click"
  - name: "输入缩放值"
    action: keyboard_type
    action: keyboard_type
    text: "10"
  - name: "确认缩放"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待缩放生效"
    action: wait
    action: wait
    wait: 2.0
  - name: "快速滚动页面"
    action: mouse_scroll
    action: mouse_scroll
    amount: -5
  - name: "等待界面刷新"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证界面显示正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
