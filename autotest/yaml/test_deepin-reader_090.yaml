name: "目录显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击目录按钮查看默认展示"
    action: element_action
    action: element_action
    ref: sidebar_catalog_btn
    do: "click"
    wait_after: 500

  - name: "验证目录树可见"
    action: wait
    wait: 0
    assert:
      - type: element_visible
        ref: catalog_tree

teardown:
  - action: session_stop
