name: "删除输入框数值再点击其他位置"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "展开左边栏"
    action: element_action
    action: element_action
    ref: sidebar_toggle_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "删除底部页数框中的数值"
    action: element_set_value
    action: element_set_value
    ref: page_input
    text: 
  - name: "点击文档空白区域"
    action: mouse_click
    action: mouse_click
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "检查页数输入框应恢复"
    action: wait
    action: wait
    wait: 0.5
  - name: "删除百分比数值框中的数值"
    action: element_set_value
    action: element_set_value
    ref: zoom_combo
    text: 
  - name: "点击文档空白区域"
    action: mouse_click
    action: mouse_click
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
