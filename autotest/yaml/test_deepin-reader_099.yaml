name: "添加新窗口"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击菜单键选择新窗口"
    action: main_menu_comb
    ref: menu_new_window
  - name: "等待新窗口打开"
    action: wait
    action: wait
    wait_after: 2000
teardown:
  - action: session_stop
