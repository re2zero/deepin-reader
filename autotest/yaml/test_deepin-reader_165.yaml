name: "全屏中的右上角菜单"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "唤出工具栏"
    action: mouse_click
    action: mouse_click
    ref: fullscreen_toolbar
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击右上角菜单按钮"
    action: element_action
    action: element_action
    ref: fullscreen_menu_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按Esc关闭菜单"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击退出全屏按钮"
    action: element_action
    action: element_action
    ref: title_quit_full_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
