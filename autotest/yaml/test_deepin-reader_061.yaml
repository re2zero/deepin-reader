name: "高亮注释方式"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "单击高亮注释"
    action: mouse_click
    action: mouse_click
    ref: doc_selected_text
    wait_after: 500

  - name: "滑动注释窗口内容"
    action: mouse_scroll
    action: mouse_scroll
    amount: -3
    wait_after: 500

teardown:
  - action: session_stop
