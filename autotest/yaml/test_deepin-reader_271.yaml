name: "进入全屏再退出，窗口大小需保持之前的状态"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "点击最大化按钮"
    action: element_action
    action: element_action
    ref: title_max_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "右击进入全屏"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Fullscreen"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "退出全屏"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Exit fullscreen"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
