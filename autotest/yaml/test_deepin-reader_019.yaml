name: "关闭标签页"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开多个文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择多个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档1.pdf /home/uos/文档2.pdf /home/uos/文档3.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证标签栏显示"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "点击+按钮添加新标签页"
    action: element_action
    action: element_action
    ref: tab_add_btn
    do: "click"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "取消选择（ESC退出）"
    action: keyboard_press
    action: keyboard_press
    keys: "Escape"
  - name: "通过Ctrl+W关闭当前标签页"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,w"
  - name: "等待关闭"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证标签页已关闭"
    action: element_visible
    action: element_visible
    ref: tab_bar

teardown:
  - action: session_stop
