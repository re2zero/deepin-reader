name: "[004]最小化. 最大化. 关闭"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击最小化按钮"
    action: element_action
    action: element_action
    ref: "title_min_btn"
    do: "click"
  - name: "等待窗口最小化"
    action: wait
    action: wait
    wait_after: 500
  - name: "恢复窗口"
    action: element_action
    action: element_action
    ref: "title_max_btn"
    do: "click"
  - name: "等待窗口恢复"
    action: wait
    action: wait
    wait_after: 500
  - name: "点击关闭按钮"
    action: element_action
    action: element_action
    ref: "title_close_btn"
    do: "click"
teardown:
  - action: session_stop
