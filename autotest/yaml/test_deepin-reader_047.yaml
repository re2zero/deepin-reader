name: "[014]开启搜索"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "通过主菜单打开搜索"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "关闭搜索"
    action: element_action
    action: element_action
    ref: search_close_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "右击文档空白区域"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Search"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
