name: "搜索过程中点击主菜单选项"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "切换双页显示"
    action: element_action
    action: element_action
    ref: double_page_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "打开搜索"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "输入关键字"
    action: keyboard_type
    action: keyboard_type
    text: document
  - name: "按Enter搜索"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击新窗口菜单"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_window
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "关闭新窗口"
    action: element_action
    action: element_action
    ref: title_close_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
