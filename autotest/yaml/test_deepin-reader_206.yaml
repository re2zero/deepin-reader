name: "编辑文档后关闭或退出，弹出是否保存对话框"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "编辑文档添加注释"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击关闭按钮"
    action: element_action
    action: element_action
    ref: "title_close_btn"
    do: "click"
  - name: "按Tab键切换焦点"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter确认"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "按ESC取消"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "esc"
teardown:
  - action: session_stop
