name: "全屏中菜单功能"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "右击选择第一页"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["First page"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "右击选择前一页"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Previous page"]
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "右击选择后一页"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Next page"]
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "右击选择最后一页"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Last page"]
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
