# YAML test case for deepin-reader — 压力/136 "打开大量窗口"
# AUTOMATABLE: Stress test for multiple window opening.
# Opens several windows via title menu, verifies no crash.
# Represents 20-window stress test with a representative sample.
name: 压力/136 打开大量窗口
app: deepin-reader
screenshot: false
description: |
  测试步骤:
  1. 打开大量窗口，查看是否卡顿
  2. 打开20个窗口，查看界面显示

  预期结果:
  1. 最大限制打开20个窗口，无卡顿
  2. 窗口错开显示。任务栏和桌面打开窗口的数量正确
module: 压力
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: '通过标题菜单打开新窗口 #1'
    action: main_menu_comb
    ref: menu_new_window
    wait: 1.5
    assert:
      - type: process_running
        app: deepin-reader
  - name: '通过标题菜单打开新窗口 #2'
    action: main_menu_comb
    ref: menu_new_window
    wait: 1.5
    assert:
      - type: process_running
        app: deepin-reader
  - name: '通过标题菜单打开新窗口 #3'
    action: main_menu_comb
    ref: menu_new_window
    wait: 1.5
    assert:
      - type: process_running
        app: deepin-reader
  - name: 验证无卡顿 — 检查主窗口可见
    action: element_action
    ref: main_frame
    do: click
    assert:
      - type: element_visible
        selector:
          role: frame
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
