name: "手型工具"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "通过主菜单切换到手型工具"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_hand_tool
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "鼠标移动到左侧栏"
    action: mouse_click
    action: mouse_click
    ref: sidebar_toggle_btn
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "鼠标点击文档区域"
    action: mouse_click
    action: mouse_click
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "长按鼠标拖动页面"
    action: mouse_drag
    action: mouse_drag
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
