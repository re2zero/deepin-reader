name: "搜索完成后按钮置灰，不应该有hover效果"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "打开搜索搜索关键字"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "输入关键字搜索"
    action: keyboard_type
    action: keyboard_type
    text: the
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "鼠标放置左侧栏底部按钮"
    action: mouse_click
    action: mouse_click
    ref: sidebar_thumbnail_btn
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
