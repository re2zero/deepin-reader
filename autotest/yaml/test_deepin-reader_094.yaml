name: "打开可读取页数的文档"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "在页数输入框输入页码"
    action: element_set_value
    action: element_set_value
    ref: page_input
    text: "10"
    wait_after: 500

  - name: "按回车跳转"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
    wait_after: 500

teardown:
  - action: session_stop
