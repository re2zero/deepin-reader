name: "[016]“高亮”菜单和“取消高亮”菜单显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 2.0
  - name: "选中文本添加高亮"
    action: mouse_drag
    action: mouse_drag
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "右击添加高亮"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_selected_text
    menu: ["Highlight"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "右击已高亮文本查看菜单"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_selected_text
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按Esc关闭菜单"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
