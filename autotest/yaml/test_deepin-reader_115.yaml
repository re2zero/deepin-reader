name: "[020]工具栏中的百分比图标显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "查看工具栏百分比图标显示"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击编辑框下拉按钮"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: click
