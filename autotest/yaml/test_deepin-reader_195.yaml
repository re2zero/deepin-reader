name: "多个文档展开左侧栏，Tab键切换"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "展开左侧栏"
    action: element_action
    action: element_action
    ref: "sidebar_toggle_btn"
    do: "click"
  - name: "打开多个标签"
    action: element_action
    action: element_action
    ref: "tab_add_btn"
    do: "click"
  - name: "按Tab键切换焦点"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter执行选择"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
teardown:
  - action: session_stop
