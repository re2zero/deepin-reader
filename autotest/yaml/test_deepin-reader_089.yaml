name: "目录与右侧文档对应"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击目录按钮"
    action: element_action
    action: element_action
    ref: sidebar_catalog_btn
    do: "click"
    wait_after: 500

  - name: "点击目录条目"
    action: element_action
    action: element_action
    ref: catalog_tree
    do: "click"
    wait_after: 500

  - name: "验证文档跳转"
    action: wait
    wait: 0
    assert:
      - type: element_visible
        ref: doc_view

teardown:
  - action: session_stop
