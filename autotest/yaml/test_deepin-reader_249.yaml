name: "已添加DJVU文档界面布局显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开DJVU文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择DJVU文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.djvu"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证顶部工具栏显示"
    action: element_visible
    action: element_visible
    ref: zoom_combo
  - name: "点击菜单按钮查看菜单项"
    action: element_action
    action: element_action
    ref: title_option_btn
    do: "click"
  - name: "等待菜单弹出"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证菜单包含新窗口"
    action: element_visible
    action: element_visible
    ref: menu_new_window
  - name: "验证菜单包含保存"
    action: element_visible
    action: element_visible
    ref: menu_save
  - name: "验证菜单包含打印"
    action: element_visible
    action: element_visible
    ref: menu_print
  - name: "点击菜单空白处关闭"
    action: keyboard_press
    action: keyboard_press
    keys: "Escape"
  - name: "验证文档区域显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "展开左边栏"
    action: element_action
    action: element_action
    ref: sidebar_toggle_btn
    do: "click"
  - name: "等待侧边栏展开"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证侧边栏可见"
    action: element_visible
    action: element_visible
    ref: sidebar
  - name: "验证缩略图按钮显示"
    action: element_visible
    action: element_visible
    ref: sidebar_thumbnail_btn
  - name: "验证书签按钮显示"
    action: element_visible
    action: element_visible
    ref: sidebar_bookmark_btn

teardown:
  - action: session_stop
