name: "[029]选中文本后右击"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "选中文本区域"
    action: mouse_click
    action: mouse_click
    ref: "doc_selected_text"
  - name: "右键点击选中区域"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_selected_text"
  - name: "验证高亮相关菜单"
    action: wait
    action: wait
    wait_after: 500
  - name: "右键点击非选中区域"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "验证页面跳转菜单"
    action: wait
    action: wait
    wait_after: 500
teardown:
  - action: session_stop
