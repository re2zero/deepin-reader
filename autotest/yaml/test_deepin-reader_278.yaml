name: "每次点击超链接都会弹出安全提示弹框"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "点击超链接"
    action: mouse_click
    action: mouse_click
    ref: hyperlink_area
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "按Esc关闭弹框"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "再次点击超链接"
    action: mouse_click
    action: mouse_click
    ref: hyperlink_area
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5

teardown:
  - action: session_stop
