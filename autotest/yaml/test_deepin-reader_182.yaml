name: "搜索结果缩略图显示收起再展开左侧栏"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "固定显示侧边栏搜索"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "打开搜索"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "输入关键字搜索"
    action: keyboard_type
    action: keyboard_type
    text: the
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "收起再展开侧边栏"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "再次展开"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
