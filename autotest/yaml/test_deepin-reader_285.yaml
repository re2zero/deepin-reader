name: "支持打开多个窗口"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击主菜单新窗口"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_new_window"
  - name: "等待新窗口"
    action: wait
    action: wait
    wait_after: 1500
  - name: "再次点击新窗口"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_new_window"
  - name: "等待第二个新窗口"
    action: wait
    action: wait
    wait_after: 1500
teardown:
  - action: session_stop
