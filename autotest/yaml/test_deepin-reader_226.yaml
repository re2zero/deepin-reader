name: "全屏显示界面打开放大镜，按esc键退出放大镜"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "通过主菜单打开放大镜"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_magnifer
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按Esc退出放大镜"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
