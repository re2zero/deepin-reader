name: "【UI】搜索框界面显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "打开搜索框"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "未输入关键词查看界面"
    action: wait
    action: wait
    wait: 0.5
  - name: "输入关键词未按Enter"
    action: keyboard_type
    action: keyboard_type
    text: test
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按Enter键搜索"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
