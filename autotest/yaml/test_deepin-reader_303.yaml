name: "2、快捷键_Ctrl+End到末尾"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "按Ctrl+End到末尾"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,end"
  - name: "等待页面跳转"
    action: wait
    action: wait
    wait_after: 1000
  - name: "点击缩略图按钮验证"
    action: element_action
    action: element_action
    ref: "sidebar_thumbnail_btn"
    do: "click"
  - name: "点击书签按钮验证"
    action: element_action
    action: element_action
    ref: "sidebar_bookmark_btn"
    do: "click"
teardown:
  - action: session_stop
