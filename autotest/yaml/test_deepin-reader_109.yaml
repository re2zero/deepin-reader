name: "取消使用放大镜"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击主菜单开启放大镜"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_magnifer"
  - name: "按ESC取消放大镜"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "esc"
  - name: "再次开启放大镜"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_magnifer"
  - name: "右键取消放大镜"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
teardown:
  - action: session_stop
