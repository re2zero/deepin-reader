name: 复制高亮注释
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开docx格式文档
  3.双页显示

  测试步骤:
  1. 右键点击高亮注释文本
  2. 选中高亮文本，点击右键菜单中复制
  3. 直接右击高亮文本，点击菜单中复制

  预期结果:
  1. 显示右键菜单：复制，高亮，取消高亮，添加注释，添加书签
  2. 可以正确复制选中的文本
  3. 可以正确复制注释内容
module: 注释
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 右键高亮注释文本
    action: mouse_right_click
    ref: doc_selected_text
    wait_after: 500
  - name: 选择复制
    action: context_menu_comb
    ref: doc_selected_text
    menu: [复制]
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
