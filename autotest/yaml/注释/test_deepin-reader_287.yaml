name: 注释内容达到上限后保存
app: deepin-reader
screenshot: false
description: |
  前置条件:
  打开pdf格式文档
  打开docx格式文档

  测试步骤:
  1. 打开文档，分别添加高亮注释和图标注释，输入注释内容均达到上限1500字
  2. 按快捷键Ctrl+S保存
  3. 关闭文档，再打开

  预期结果:
  1. 添加成功
  2. 弹出“保存成功”提示
  3. 高亮注释和图标注释显示正确
module: 注释
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 添加高亮注释
    action: mouse_right_click
    ref: doc_center
    wait_after: 500
  - name: 选择添加高亮
    action: context_menu_comb
    ref: doc_center
    menu: AddTextHighlight
    wait_after: 500
  - name: 输入达到上限的注释内容
    action: keyboard_type
    text: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    wait_after: 500
  - name: 按Ctrl+S保存
    action: keyboard_hot_key
    keys: ctrl,s
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
