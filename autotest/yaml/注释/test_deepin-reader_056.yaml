name: 删除图标注释方式
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开docx格式文档
  3.双页显示

  测试步骤:
  1. 右击注释小图标，选择右键菜单中的删除注释进行删除
  2. 点击注释小图标，弹出小窗口，删除窗口所有内容，点击窗口的x或窗口之外区域
  3. 右击缩略图_注释，选择删除菜单
  4. 单击缩略图_注释，按delete快捷键进行删除

  预期结果:
  1. 可以正常删除注释，左边栏缩略图_注释同步被删除
  2. 可以正常删除注释，左边栏缩略图_注释同步被删除
  3. 可以正常删除注释，左边栏缩略图_注释同步被删除
  4. 可以正常删除注释，左边栏缩略图_注释同步被删除
module: 注释
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 右键注释图标选择删除
    action: mouse_right_click
    ref: doc_annotation_icon
    wait_after: 500
  - name: 选择删除注释
    action: context_menu_comb
    ref: doc_annotation_icon
    menu: [删除注释]
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
