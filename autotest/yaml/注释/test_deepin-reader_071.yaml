name: 添加高亮注释方式（有高亮显示，无注释小图标显示）
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开docx格式文档
  3.双页显示

  测试步骤:
  1. 选中文本，右键点击在文字上，点击右键菜单的“添加注释”，查看是否弹出高亮注释窗口

  预期结果:
  1. 弹出高亮注释窗口，可以添加高亮注释成功
module: 注释
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 选中文本
    action: mouse_click
    ref: doc_selected_text
    wait_after: 500
  - name: 右键添加高亮注释
    action: mouse_right_click
    ref: doc_selected_text
    wait_after: 500
  - name: 选择添加注释
    action: context_menu_comb
    ref: doc_selected_text
    menu: [添加注释]
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
