name: 浅色和深色主题下查看右侧和底部进度条显示
app: deepin-reader
screenshot: false
description: |
  测试步骤:
  1. 打开文档，分别查看右侧和底部进度条显示
  2. 切换至深色，打开文档，分别查看右侧和底部进度条显示

  预期结果:
  1. 显示清晰，无异常
  2. 显示清晰，无异常
module: 文档打开
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader
    wait: 3.0
steps:
  - name: 打开PDF文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 输入文件路径
    action: keyboard_type
    text: /home/uos/测试文档.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证右侧滚动条显示
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: verticalScrollBar
          role: scroll bar
  - name: 验证底部滚动条显示
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: horizontalScrollBar
          role: scroll bar
  - name: 切换至深色主题
    action: main_menu_comb
    ref: menu_display_in_fm
  - name: 等待主题切换
    action: wait
    wait: 2.0
  - name: 验证深色主题下右侧滚动条
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: verticalScrollBar
          role: scroll bar
  - name: 验证深色主题下底部滚动条
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: horizontalScrollBar
          role: scroll bar
teardown:
  - action: session_stop
