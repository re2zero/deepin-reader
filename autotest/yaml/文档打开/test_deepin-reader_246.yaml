name: 翻页，页面显示流畅
app: deepin-reader
screenshot: false
description: |
  前置条件:
  分别打开PDF、DJVU、DOCX格式文档测试

  测试步骤:
  1. 打开文档，鼠标滚轮滑动，查看显示
  2. 打开文档，拖拽右侧和底部滚动条

  预期结果:
  1. 页面翻页流畅，无闪烁
  2. 页面翻页流畅，无闪烁
module: 文档打开
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader
    wait: 3.0
steps:
  - name: 打开PDF文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择文档
    action: keyboard_type
    text: /home/uos/测试文档.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 鼠标滚轮向下翻页
    action: mouse_scroll
    amount: -3
  - name: 等待翻页
    action: wait
    wait: 1.0
  - name: 验证文档视图正常
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
  - name: 鼠标滚轮向上翻页
    action: mouse_scroll
    amount: 3
  - name: 等待翻页
    action: wait
    wait: 1.0
  - name: 验证文档视图正常
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
  - name: 拖拽垂直滚动条翻页
    action: element_action
    ref: doc_scrollbar_v
    do: click
  - name: 等待翻页
    action: wait
    wait: 1.0
  - name: 验证页面显示流畅
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
  - name: 拖拽水平滚动条
    action: element_action
    ref: doc_scrollbar_h
    do: click
  - name: 等待翻页
    action: wait
    wait: 1.0
  - name: 验证页面显示正常
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
teardown:
  - action: session_stop
