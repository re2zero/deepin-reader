name: 选中多个文档，右击打开
app: deepin-reader
screenshot: false
description: |
  测试步骤:
  1. 选中多个PDF格式文档，右键菜单选择打开
  2. 选中多个DJVU格式文档，右键菜单选择打开
  3. 选中多个DOCX格式文档，右键菜单选择打开

  预期结果:
  1. 正常打开所有选择的文档
  2. 正常打开所有选择的文档
  3. 正常打开所有选择的文档
module: 文档打开
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader
    wait: 3.0
steps:
  - name: 打开文件对话框
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择多个PDF文档
    action: keyboard_type
    text: /home/uos/文档1.pdf /home/uos/文档2.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证标签栏显示多个标签页
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: page tab list
  - name: 关闭所有标签页
    action: keyboard_hot_key
    keys: ctrl,w
  - name: 重复测试DJVU格式
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择多个DJVU文档
    action: keyboard_type
    text: /home/uos/文档1.djvu /home/uos/文档2.djvu
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证标签栏显示多个标签页
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: page tab list
teardown:
  - action: session_stop
