name: 重命名后再打开文档
app: deepin-reader
screenshot: false
description: |
  前置条件:
  准备PDF、DJVU、DOCX文档

  测试步骤:
  1. 重命名文档，在名称中按tab键
  2. 重命名文档，在名称中按enter键
  3. 重命名文档，在名称中按空格键，再打开此文档
  4. 重命名文档，在名称中输入特殊字符、标点符号（%# ，。等），再打开此文档

  预期结果:
  1. 按tab键不起作用
  2. 按enter键不起作用
  3. 正常打开
  4. 正常打开
module: 文档打开
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader
    wait: 3.0
steps:
  - name: 打开重命名后的PDF文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 输入含空格的文件名
    action: keyboard_type
    text: /home/uos/测试 文档.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证文档已打开
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
  - name: 关闭当前标签页
    action: keyboard_hot_key
    keys: ctrl,w
  - name: 等待关闭
    action: wait
    wait: 1.0
  - name: 打开含特殊字符文件名的文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 输入含特殊字符的文件名
    action: keyboard_type
    text: /home/uos/测试%#文档.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证文档正常打开
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
teardown:
  - action: session_stop
