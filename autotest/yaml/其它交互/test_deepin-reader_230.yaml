name: 按Ctrl+1，视图调整菜单同步勾选
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 打开文档，按Ctrl+1，点击百分比下拉框查看

  预期结果:
  1. 默认大小和100%选项都会自动勾选
module: 其它交互
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 按Ctrl+1默认大小
    action: keyboard_hot_key
    keys: ctrl,1
  - name: 点击百分比下拉框
    action: element_action
    ref: zoom_combo
    do: click
  - name: 验证100%已勾选
    action: wait
    wait_after: 500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
