name: 快捷键
app: deepin-reader
screenshot: false
description: |
  测试步骤:
  1. 按Ctrl+Shift+？ --显示快捷键预览，查看所有快捷键使用是否正常：
  F1 --进入帮助界面
  Ctrl+O --进入文件管理选择界面
  Ctrl+shift+S --另存为
  Ctrl+S --保存
  Ctrl+P --打印
  Ctrl+M --打开目录缩略图
  Ctrl+1 --默认大小
  Ctrl+2 --适应高度
  Ctrl+3 --适应宽度
  Ctrl+R --左旋转
  Ctrl+Shift+R --右旋转
  Ctrl++ --页面放大
  Ctrl+- --页面缩小
  PageUp --上一页
  PageDown --下一页
  Up -- 上一行
  Down -- 下一行
  Esc --退出
  Alt+1 --选择工具
  Alt+2 --手形工具
  Ctrl+D --添加书签
  Alt+A --添加注释
  Alt+H --添加高亮
  Delete --删除   （备注：删除书签或注释目录）
  Alt+Z --放大镜
  Ctrl+F --搜索
  F5 --幻灯片放映
  F11 --全屏
  （备注：以下针对注释小窗口中内容进行操作）
  Ctrl+C --复制
  Ctrl+X --剪切
  Ctrl+V --粘贴
  Delete --删除
  Ctrl+S --保存
  Ctrl+Z --撤销
  Ctrl+A --全选
  2. 打开DJVU格式文档，按Ctrl+Shift+？ --显示快捷键预览，查看所有快捷键使用是否正常：
  除 Alt+A --添加注释，Alt+H --添加高亮， Ctrl+F --搜索 三个快捷键不支持，其余快捷键同步骤1）

  预期结果:
  1. 快捷键使用均正常
  2. 快捷键使用均正常
module: 其它交互
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 按Ctrl+S保存
    action: keyboard_hot_key
    keys: ctrl,s
  - name: 按Ctrl+P打印
    action: keyboard_hot_key
    keys: ctrl,p
  - name: 按Ctrl+1默认大小
    action: keyboard_hot_key
    keys: ctrl,1
  - name: 按Ctrl+R左旋转
    action: keyboard_hot_key
    keys: ctrl,r
  - name: 按Ctrl+Shift+R右旋转
    action: keyboard_hot_key
    keys: ctrl,shift,r
  - name: 按Ctrl++放大
    action: keyboard_hot_key
    keys: ctrl,=
  - name: 按Ctrl+-缩小
    action: keyboard_hot_key
    keys: ctrl,-
  - name: 按F11全屏
    action: keyboard_hot_key
    keys: f11
  - name: 按ESC退出全屏
    action: keyboard_hot_key
    keys: esc
  - name: 按Ctrl+F搜索
    action: keyboard_hot_key
    keys: ctrl,f
  - name: 关闭搜索
    action: element_action
    ref: search_close_btn
    do: click
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
