name: 2、快捷键_Ctrl+End到末尾
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开文档查看器
  2.依次打开非加密的标准PDF，DJVU，DOCX
  3.首页、尾页有书签
  4.首页、尾页有注释

  测试步骤:
  1. 当前页非尾页，同时按快捷键Ctrl+End（笔记本Ctrl+右键），查看右侧详情页
  2. 点击缩略图按钮，进入缩略图页
  3. 点击缩略图-书签按钮，进入书签页
  4. 点击缩略图-注释按钮，进入注释页

  预期结果:
  1. 右侧详情页定位到末尾
  2. 缩略图-缩略图页 高亮定位到文件的末尾
  3. 缩略图-书签页 跟随高亮定位到文件的末尾
  4. 缩略图-注释 没有高亮定位到任何页
module: 其它交互
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 按Ctrl+End到末尾
    action: keyboard_hot_key
    keys: ctrl,end
  - name: 等待页面跳转
    action: wait
    wait_after: 1000
  - name: 点击缩略图按钮验证
    action: element_action
    ref: sidebar_thumbnail_btn
    do: click
  - name: 点击书签按钮验证
    action: element_action
    ref: sidebar_bookmark_btn
    do: click
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
