name: 双页、调整百分比、打开单页大文档时使用放大镜
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 双页显示时，调整到最小百分比，使用放大镜查看显示是否正常
  2. 双页显示时，调整到最大百分比，使用放大镜查看显示是否正常
  3. 打开单页超大文档（75M以上），并调整百分比至最大，使用放大镜查看显示是否正常

  预期结果:
  1. 放大镜放置区域内容（包括文字、图片、高亮文本、注释小图标、书签图标）均被正常放大，界面显示正常
  2. 放大镜放置区域内容（包括文字、图片、高亮文本、注释小图标、书签图标）均被正常放大，界面显示正常
  3. 放大镜放置区域内容（包括文字、图片、高亮文本、注释小图标、书签图标）均被正常放大，界面显示正常
module: 其它交互
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 切换双页显示
    action: element_action
    ref: double_page_btn
    do: click
  - name: 调整最小百分比
    action: element_action
    ref: zoom_out_btn
    do: click
  - name: 开启放大镜
    action: main_menu_comb
    ref: menu_magnifer
  - name: 移动鼠标查看放大效果
    action: mouse_click
    ref: doc_center
  - name: 取消放大镜
    action: keyboard_hot_key
    keys: esc
  - name: 调整最大百分比
    action: element_action
    ref: zoom_in_btn
    do: click
  - name: 再次开启放大镜
    action: main_menu_comb
    ref: menu_magnifer
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
