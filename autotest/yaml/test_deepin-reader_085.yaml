name: "点击缩略图_书签"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击书签按钮"
    action: element_action
    action: element_action
    ref: sidebar_bookmark_btn
    do: "click"
    wait_after: 500

  - name: "点击书签条目跳转"
    action: element_action
    action: element_action
    ref: bookmark_list
    do: "click"
    wait_after: 500

teardown:
  - action: session_stop
