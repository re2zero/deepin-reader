name: "多窗口多标签页时不支持打开相同文档"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开文档A"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档A"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档A.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证文档A显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "再次尝试打开相同文档A"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "再次选择文档A"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档A.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待响应"
    action: wait
    action: wait
    wait: 2.0
  - name: "验证未添加重复标签页（当前页激活）"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
