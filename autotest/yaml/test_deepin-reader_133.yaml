name: "文档翻页"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "按键盘下键逐行翻页"
    action: keyboard_press
    action: keyboard_press
    keys: Down
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按PageDown翻页"
    action: keyboard_press
    action: keyboard_press
    keys: Page_Down
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击百分比输入框"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按PageDown（焦点在输入框）"
    action: keyboard_press
    action: keyboard_press
    keys: Page_Down
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击文档区域"
    action: mouse_click
    action: mouse_click
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按PageDown翻页"
    action: keyboard_press
    action: keyboard_press
    keys: Page_Down
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
