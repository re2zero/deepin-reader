name: "复制高亮注释"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键高亮注释文本"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_selected_text
    wait_after: 500

  - name: "选择复制"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_selected_text
    menu: "Copy"
    wait_after: 500

teardown:
  - action: session_stop
