name: 支持打开多个窗口
app: deepin-reader
screenshot: false
description: "测试步骤:\n1. 打开文档查看器\n2. 点击主菜单弹出菜单列表，点击“新窗口”菜单\n3. 重复步骤2\n\n预期结果:\n1. \n\
  2. 弹出一个新窗口\n3. 继续弹出新窗口，窗口数量限制在20个以内，窗口不会重叠在一起\n"
module: 主菜单
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 点击主菜单新窗口
    action: main_menu_comb
    ref: menu_new_window
  - name: 等待新窗口
    action: wait
    wait_after: 1500
  - name: 再次点击新窗口
    action: main_menu_comb
    ref: menu_new_window
  - name: 等待第二个新窗口
    action: wait
    wait_after: 1500
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
