name: 保存替换文档
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 添加高亮/注释/书签，点击另存为
  2. 不改变名称，点击“保存”按钮
  3. 点击“替换”按钮
  4. 点击文档查看器应用关闭按钮
  5. 再次打开替换后的文档

  预期结果:
  1. 弹出保存文档界面
  2. 弹出是否替换文档弹框
  3. 新编辑的文档正常替换原文档
  4. 直接关闭应用
  5. 界面显示正常，添加的高亮/注释/书签保存正常
module: 主菜单
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 添加注释编辑文档
    action: context_menu_comb
    ref: doc_center
  - name: 点击添加注释
    action: element_action
    ref: context_add_annotation
    do: click
  - name: 点击另存为
    action: main_menu_comb
    ref: menu_save_as
  - name: 等待另存对话框
    action: wait
    wait_after: 1000
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
