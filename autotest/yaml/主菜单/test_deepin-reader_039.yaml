name: 编辑后进行另存
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 打开文档，添加高亮、书签或注释，点击工具栏中的菜单键，再点击另存为
  2. 点击打开新文档，查看高亮、书签、注释等内容是否均被保存
  3. 关闭旧文档，弹出是否保存的提示框，分别点击保存和不保存按钮

  预期结果:
  1. 弹出系统文件弹框，弹出文档选择器，输入名字可将文件保存为新的文件
  2. 文档中编辑内容都被保存
  3. 点击不保存，编辑内容不会被保存；点击保存，编辑内容会被保存
module: 主菜单
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 点击文档区域
    action: mouse_click
    ref: doc_center
  - name: 添加高亮注释
    action: context_menu_comb
    ref: doc_center
  - name: 点击主菜单
    action: main_menu_comb
    ref: menu_save_as
  - name: 等待另存对话框
    action: wait
    wait_after: 1000
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
