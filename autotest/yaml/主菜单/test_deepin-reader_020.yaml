name: '[007]保存'
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 打开文档，添加书签或注释
  2. 点击主菜单查看
  3. 打开文档，添加书签或注释，按键盘中Ctrl+S键，关闭再打开文档查看是否可以保存
  4. 关闭再打开文档查看是否可以保存

  预期结果:
  1. 添加成功
  2. 保存菜单高亮显示
  3. 保存成功
  4. 书签和注释可以被保存
module: 主菜单
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 打开文档添加书签注释
    action: mouse_click
    ref: doc_center
  - name: 点击主菜单
    action: main_menu_comb
    ref: menu_save
  - name: 等待保存完成
    action: wait
    wait_after: 1000
  - name: 按Ctrl+S保存
    action: keyboard_hot_key
    keys: ctrl,s
  - name: 等待保存完成
    action: wait
    wait_after: 1000
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
