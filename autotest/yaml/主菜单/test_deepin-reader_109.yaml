name: 取消使用放大镜
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档
  4.双页显示

  测试步骤:
  1. 使用放大镜功能时，按键盘上的ESC键
  2. 使用放大镜功能时，点击鼠标右键

  预期结果:
  1. 可以取消放大镜功能
  2. 可以取消放大镜功能
module: 主菜单
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 点击主菜单开启放大镜
    action: main_menu_comb
    ref: menu_magnifer
  - name: 按ESC取消放大镜
    action: keyboard_hot_key
    keys: esc
  - name: 再次开启放大镜
    action: main_menu_comb
    ref: menu_magnifer
  - name: 右键取消放大镜
    action: context_menu_comb
    ref: doc_center
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
