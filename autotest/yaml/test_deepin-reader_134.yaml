name: "焦点定位与书签/注释缩略图的删除"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "展开左边栏"
    action: element_action
    action: element_action
    ref: sidebar_toggle_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击书签标签页"
    action: element_action
    action: element_action
    ref: sidebar_bookmark_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "选中书签"
    action: mouse_click
    action: mouse_click
    ref: bookmark_list
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按Delete键删除"
    action: keyboard_press
    action: keyboard_press
    keys: Delete
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击文档区域"
    action: mouse_click
    action: mouse_click
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "按Delete键（焦点不在列表）"
    action: keyboard_press
    action: keyboard_press
    keys: Delete
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
