name: "[026]进入全屏"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "右击选择全屏菜单"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: ["Fullscreen"]
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "退出全屏"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "按F11进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5

teardown:
  - action: session_stop
