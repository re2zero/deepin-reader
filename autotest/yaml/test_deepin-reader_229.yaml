name: "重命名后再打开文档"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开重命名后的PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "输入含空格的文件名"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试 文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证文档已打开"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "关闭当前标签页"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,w"
  - name: "等待关闭"
    action: wait
    action: wait
    wait: 1.0
  - name: "打开含特殊字符文件名的文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "输入含特殊字符的文件名"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试%#文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证文档正常打开"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
