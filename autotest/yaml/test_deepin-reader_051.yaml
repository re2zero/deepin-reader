name: "复制左侧栏的注释目录"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键点击注释目录"
    action: mouse_right_click
    action: mouse_right_click
    ref: annotation_list
    wait_after: 500

  - name: "选择复制菜单"
    action: context_menu_comb
    action: context_menu_comb
    ref: annotation_list
    menu: "CopyAnnoText"
    wait_after: 500

teardown:
  - action: session_stop
