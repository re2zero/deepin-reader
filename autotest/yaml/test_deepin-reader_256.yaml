name: "[030]docx文档打开界面显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开docx文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档转化加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证文档视图显示"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "验证工具栏显示"
    action: element_visible
    action: element_visible
    ref: zoom_combo
  - name: "验证标签栏显示"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "验证界面布局正常"
    action: element_visible
    action: element_visible
    ref: main_window

teardown:
  - action: session_stop
