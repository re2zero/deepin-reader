name: "未选中图标注释进行移动"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "长按注释图标移动"
    action: mouse_drag
    action: mouse_drag
    ref: doc_annotation_icon
    wait_after: 1000

  - name: "点击其他区域取消选中"
    action: mouse_click
    action: mouse_click
    ref: doc_center
    wait_after: 500

teardown:
  - action: session_stop
