name: "[018]百分比图标的下拉框"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "点击百分比下拉框"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "选择百分比选项"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击放大按钮"
    action: element_action
    action: element_action
    ref: zoom_in_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击缩小按钮"
    action: element_action
    action: element_action
    ref: zoom_out_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5

teardown:
  - action: session_stop
