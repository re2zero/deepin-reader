name: "重叠高亮文本添加注释"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "选中文本"
    action: mouse_click
    action: mouse_click
    ref: doc_selected_text
    wait_after: 500

  - name: "右键添加高亮"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_center
    wait_after: 500

  - name: "选择高亮菜单"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddTextHighlight"
    wait_after: 500

  - name: "重叠选中另一段文本并添加注释"
    action: mouse_click
    action: mouse_click
    ref: doc_selected_text
    wait_after: 500

teardown:
  - action: session_stop
