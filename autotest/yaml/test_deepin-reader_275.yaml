name: "超链接详情浮窗显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 2.0
  - name: "鼠标放置在超链接文本上"
    action: mouse_click
    action: mouse_click
    ref: hyperlink_area
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "移走鼠标"
    action: mouse_click
    action: mouse_click
    ref: doc_center
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
