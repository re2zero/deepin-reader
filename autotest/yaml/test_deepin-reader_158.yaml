name: "左键单击取消右键菜单"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键注释图标"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_annotation_icon
    wait_after: 500

  - name: "左键点击其他区域取消"
    action: mouse_click
    action: mouse_click
    ref: doc_center
    wait_after: 500

teardown:
  - action: session_stop
