name: "选择手型工具后退出全屏"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "通过主菜单切换手型工具"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_hand_tool
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "退出全屏"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
