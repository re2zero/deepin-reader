name: "【UI】是否保存提示语显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择PDF文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "添加注释进行编辑"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddAnnotationIcon"
  - name: "等待编辑"
    action: wait
    action: wait
    wait: 2.0
  - name: "关闭标签页"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,w"
  - name: "等待保存提示框"
    action: wait
    action: wait
    wait: 2.0
  - name: "验证保存提示框显示"
    action: element_visible
    action: element_visible
    ref: dialog_confirm
  - name: "查看提示语内容（OCR验证）"
    action: ocr_exist
    action: ocr_exist
    text: "是否保存"
  - name: "点击不保存"
    action: keyboard_press
    action: keyboard_press
    keys: "Tab"
  - name: "切换按钮"
    action: wait
    action: wait
    wait: 0.5
  - name: "确认不保存"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"

teardown:
  - action: session_stop
