name: "选中未高亮文本进行复制"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "选中文本区域"
    action: mouse_click
    action: mouse_click
    ref: "doc_selected_text"
  - name: "右键点击选中区域"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_selected_text"
  - name: "点击复制"
    action: element_action
    action: element_action
    ref: "context_copy"
    do: "click"
  - name: "按Ctrl+C复制"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,c"
  - name: "右键点击选中区域"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_selected_text"
  - name: "点击高亮"
    action: element_action
    action: element_action
    ref: "context_highlight"
    do: "click"
teardown:
  - action: session_stop
