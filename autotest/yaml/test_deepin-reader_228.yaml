name: "百分比框和页码框输入数值，按键盘enter键"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击百分比框"
    action: element_action
    action: element_action
    ref: "zoom_combo"
    do: "click"
  - name: "输入数值100"
    action: keyboard_type
    action: keyboard_type
    ref: "zoom_combo"
  - name: "按Enter确认"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "点击页码框"
    action: element_action
    action: element_action
    ref: "page_input"
    do: "click"
  - name: "输入页码2"
    action: keyboard_type
    action: keyboard_type
    ref: "page_input"
  - name: "按Enter跳转"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
teardown:
  - action: session_stop
