name: "不输入内容点击其他位置，取消添加注释"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键添加注释"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_center
    wait_after: 500

  - name: "选择添加注释图标"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddAnnotationIcon"
    wait_after: 500

  - name: "不输入内容直接点击其他区域"
    action: mouse_click
    action: mouse_click
    ref: doc_center
    wait_after: 500

teardown:
  - action: session_stop
