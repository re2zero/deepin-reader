name: 全屏后点击缩略图图标
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 全屏后唤出工具栏，未唤出侧边栏时，点击缩略图图标
  2. 全屏后唤出工具栏和侧边栏时，点击缩略图图标

  预期结果:
  1. 缩略图图标高亮显示，鼠标移动到左侧栏不会隐藏左侧栏
  2. 缩略图图标高亮显示，鼠标移动到左侧栏不会隐藏左侧栏
module: 操作
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 唤出工具栏点击缩略图图标
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 查看侧边栏显示
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
