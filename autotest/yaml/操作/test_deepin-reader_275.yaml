name: 超链接详情浮窗显示
app: deepin-reader
screenshot: false
description: |
  前置条件:
  打开PDF格式文档
  打开docx格式文档

  测试步骤:
  1. 打开带有超链接文本的文档，鼠标（默认选择样式）放置在超链接文本之上，查看
  2. 移走鼠标，查看

  预期结果:
  1. 鼠标显示为手形样式，显示超链接详情浮窗，浮窗立即显示无间隔时长，与UI图相符。浮窗内容无法点击
  2. 超链接详情浮窗和手形样式消失，鼠标恢复选择样式
module: 操作
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 等待文档加载
    action: wait
    wait: 2.0
  - name: 鼠标放置在超链接文本上
    action: mouse_click
    ref: hyperlink_area
  - name: 等待
    action: wait
    wait: 1.0
  - name: 移走鼠标
    action: mouse_click
    ref: doc_center
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
