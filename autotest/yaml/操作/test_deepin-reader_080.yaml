name: 默认选中橘黄色高亮
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开普通PDF文档，
  2.打开PDF格式的单页大文档（75M）
  3. 打开docx格式文档

  测试步骤:
  1. 首次打开文档，选中多行文本右击，查看默认选中的颜色圈图标
  2. 切换颜色后，选中多行文本右击，关闭文档再打开，查看默认的颜色图标

  预期结果:
  1. 默认选中橘黄色图标
  2. 默认选中橘黄色图标
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 等待文档加载
    action: wait
    wait: 2.0
  - name: 选中多行文本右击
    action: mouse_drag
    ref: doc_center
  - name: 等待
    action: wait
    wait: 0.5
  - name: 右击查看默认颜色
    action: mouse_right_click
    ref: doc_selected_text
  - name: 等待
    action: wait
    wait: 1.0
  - name: 按Esc关闭菜单
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 0.5
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
