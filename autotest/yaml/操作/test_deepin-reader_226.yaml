name: 全屏显示界面打开放大镜，按esc键退出放大镜
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 全屏显示界面打开放大镜
  2. 按esc键

  预期结果:
  1. 正常打开
  2. 退出放大镜，不会退出全屏显示
module: 操作
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 通过主菜单打开放大镜
    action: main_menu_comb
    ref: menu_magnifer
  - name: 等待
    action: wait
    wait: 1.0
  - name: 按Esc退出放大镜
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
