name: 记住高亮规则
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开普通PDF文档，
  2.打开PDF格式的单页大文档（75M）

  测试步骤:
  1. 选中文本，右击选择一种高亮颜色（如：蓝色）
  2. 不关闭应用，右击另一段高亮文本，右击弹出右键菜单查看
  3. 选中文本，右击选择一种高亮颜色（如：蓝色）
  4. 不关闭应用，选择另一段未高亮文本，右击弹出右键菜单查看

  预期结果:
  1. 文本添加蓝色高亮
  2. 右键菜单中蓝色图标仍为选中状态，点击“高亮”菜单，文本切换为蓝色高亮
  3. 文本添加蓝色高亮
  4. 右键菜单中蓝色图标仍为选中状态，点击“高亮”菜单，文本添加蓝色高亮
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 等待文档加载
    action: wait
    wait: 2.0
  - name: 选中文本右击选择蓝色高亮
    action: mouse_drag
    ref: doc_center
  - name: 等待
    action: wait
    wait: 0.5
  - name: 通过右键菜单更改高亮颜色
    action: context_menu_comb
    ref: doc_selected_text
    menu:
      - 高亮
  - name: 等待
    action: wait
    wait: 1.0
  - name: 右击另一段已高亮文本查看菜单
    action: context_menu_comb
    ref: doc_selected_text
    menu:
      - 高亮
  - name: 等待
    action: wait
    wait: 1.0
  - name: 选中另一段未高亮文本
    action: mouse_drag
    ref: doc_center
  - name: 等待
    action: wait
    wait: 0.5
  - name: 右击添加高亮查看颜色
    action: context_menu_comb
    ref: doc_selected_text
    menu:
      - 高亮
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
