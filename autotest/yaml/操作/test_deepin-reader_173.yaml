name: 退出全屏后的标题显示
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 仅只打开一份文档，进入再退出全屏，查看标题栏的显示
  2. 打开多份文档，进入再退出全屏，查看标题栏的显示

  预期结果:
  1. 标题栏的显示无变化
  2. 标题栏的显示无变化
module: 操作
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 退出全屏
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 1.0
  - name: 查看标题栏显示
    action: wait
    wait: 0.5
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
