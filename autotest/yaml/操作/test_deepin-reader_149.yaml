name: 全屏前隐藏了左侧栏
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 全屏前隐藏了左侧栏再进入全屏，鼠标移动到窗口侧边
  2. 鼠标移出侧边栏区域

  预期结果:
  1. 1秒内呼唤出侧边栏；
  2. 1秒内自动隐藏侧边栏
module: 操作
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 隐藏侧边栏
    action: element_action
    ref: sidebar_toggle_btn
    do: click
  - name: 等待
    action: wait
    wait: 0.5
  - name: 进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 鼠标移到窗口侧边
    action: mouse_click
    ref: fullscreen_sidebar_btn
  - name: 等待
    action: wait
    wait: 2.0
  - name: 鼠标移出侧边栏
    action: mouse_click
    ref: doc_center
  - name: 等待
    action: wait
    wait: 2.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
