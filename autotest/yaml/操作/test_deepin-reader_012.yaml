name: 删除输入框数值再点击其他位置
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 展开左边栏，删除底部页数框中的数值，再点击窗口内外其他位置
  2. 删除百分比数值框中的数值，再点击窗口内外其他位置

  预期结果:
  1. 输入框中应该再次显示最近一次的数据
  2. 输入框中应该再次显示最近一次的数据
module: 操作
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 展开左边栏
    action: element_action
    ref: sidebar_toggle_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 删除底部页数框中的数值
    action: element_set_value
    ref: page_input
    text: null
  - name: 点击文档空白区域
    action: mouse_click
    ref: doc_center
  - name: 等待
    action: wait
    wait: 1.0
  - name: 检查页数输入框应恢复
    action: wait
    wait: 0.5
  - name: 删除百分比数值框中的数值
    action: element_set_value
    ref: zoom_combo
    text: null
  - name: 点击文档空白区域
    action: mouse_click
    ref: doc_center
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
