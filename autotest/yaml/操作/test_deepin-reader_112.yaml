name: 默认使用选择工具和文档的浏览效果
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1. 分别打开PDF和DJVU格式文档测试
  2. 打开docx文档

  测试步骤:
  1. 文档打开后，查看默认使用的工具
  2. 鼠标移动到左边栏和右侧文档并点击
  3. 长按鼠标，查看能否拖动页面

  预期结果:
  1. 默认使用选择工具，工具栏显示选择工具图标
  2. 鼠标移动到非可选文档处仍显示选择样式，点击可选择任意缩略图和按钮；鼠标移动到右侧文档变成竖形选择文本图标，可以选择文本；鼠标移动到链接内容显示为手型样式，点击进入相应链接
  3. 无法拖动页面
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 等待文档加载，查看默认工具
    action: wait
    wait: 2.0
  - name: 鼠标移动到左侧栏
    action: mouse_click
    ref: sidebar_toggle_btn
  - name: 等待
    action: wait
    wait: 0.5
  - name: 鼠标点击文档区域
    action: mouse_click
    ref: doc_center
  - name: 等待
    action: wait
    wait: 0.5
  - name: 尝试拖动页面
    action: mouse_drag
    ref: doc_center
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
