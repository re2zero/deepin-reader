name: '[040]进入全屏呼唤出侧边栏'
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 打开文档，展开侧边栏，点击全屏菜单
  2. 鼠标移动到窗口侧边
  3. 鼠标移出侧边栏区域

  预期结果:
  1. 进入全屏界面，侧边栏隐藏
  2. 1秒内呼唤出侧边栏，“侧边栏”按钮为非选中状态，底部选中的按钮与全屏前一致
  3. 自动隐藏侧边栏
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 展开侧边栏
    action: element_action
    ref: sidebar_toggle_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 点击全屏菜单
    action: context_menu_comb
    ref: doc_center
    menu:
      - Fullscreen
  - name: 等待
    action: wait
    wait: 1.5
  - name: 鼠标移到窗口侧边
    action: mouse_click
    ref: fullscreen_sidebar_btn
  - name: 等待
    action: wait
    wait: 1.5
  - name: 鼠标移出侧边栏
    action: mouse_click
    ref: doc_center
  - name: 等待
    action: wait
    wait: 2.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
