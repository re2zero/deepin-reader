name: '[026]进入全屏'
app: deepin-reader
screenshot: false
description: "前置条件:\n1.打开pdf格式文档\n2.打开djvu格式文档\n3.打开docx格式文档\n\n测试步骤:\n1. 打开文档，不选中文本右击，弹出右键菜单，点击全屏菜单\n\
  2. 打开文档，按F11键\n\n预期结果:\n1. \n2. 1&2.进入全屏界面，隐藏“标题栏”和“侧边栏”\n"
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 右击选择全屏菜单
    action: context_menu_comb
    ref: doc_center
    menu:
      - Fullscreen
  - name: 等待
    action: wait
    wait: 1.5
  - name: 退出全屏
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 1.0
  - name: 按F11进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.5
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
