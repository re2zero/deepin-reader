name: 视图调整菜单
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 首次打开文档，查看文档默认显示效果
  2. 点击双页显示
  3. 点击适合宽度
  4. 点击适合高度
  5. 点击左旋转
  6. 点击右旋转

  预期结果:
  1. 默认为单页，适合页面
  2. 进入双页显示模式
  3. 页面宽度在视窗内全部显示
  4. 页面高度在视窗内全部显示
  5. 仅当前页面正常进行左旋转，左边栏和工具栏不会翻转，旋转效果顺畅
  6. 仅当前页面正常进行右旋转，左边栏和工具栏不会翻转，旋转效果顺畅
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 查看默认显示效果
    action: wait
    wait: 1.0
  - name: 点击双页显示
    action: element_action
    ref: double_page_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.5
  - name: 点击适合宽度
    action: element_action
    ref: fit_to_width_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.5
  - name: 点击适合高度
    action: element_action
    ref: fit_to_height_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.5
  - name: 左旋转
    action: context_menu_comb
    ref: doc_center
    menu:
      - Rotate left
  - name: 等待
    action: wait
    wait: 1.5
  - name: 右旋转
    action: context_menu_comb
    ref: doc_center
    menu:
      - Rotate right
  - name: 等待
    action: wait
    wait: 1.5
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
