name: 不同视图下进入全屏
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 隐藏侧边栏时，进入全屏
  2. 展开侧边栏时，进入全屏

  预期结果:
  1. 侧边栏和标题栏自动隐藏
  2. 侧边栏和标题栏自动隐藏
module: 操作
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 隐藏侧边栏进入全屏
    action: context_menu_comb
    ref: doc_center
    menu:
      - Fullscreen
  - name: 等待
    action: wait
    wait: 1.5
  - name: 退出全屏
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 1.0
  - name: 展开侧边栏
    action: element_action
    ref: sidebar_toggle_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 再次进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.5
  - name: 退出全屏
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
