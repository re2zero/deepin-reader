name: 6、视图保持_调整页面视图后新窗口打开新文档
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.文档A、B从未使用文档查看器打开过

  测试步骤:
  1. 打开文档A且调整页面视图为A（适合页面）
  2. 在新窗口打开文档B

  预期结果:
  1. 调整页面视图成功
  2. 新打开的文档B页面视图为A（适合页面）
module: 操作
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 调整页面视图为适合页面
    action: element_action
    ref: fit_to_page_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 新窗口打开文档
    action: main_menu_comb
    ref: menu_new_window
  - name: 等待
    action: wait
    wait: 2.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
