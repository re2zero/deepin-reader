name: 17、视图保持_修改页面视图后在多标签页打开调整过页面视图的文档
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开文档A调整页面视图为A（适合页面），关闭文档A
  2.打开文档B调整页面视图为B（25%），关闭文档B

  测试步骤:
  1. 窗口1查看文档C且调整页面视图C（200%），窗口2查看文档D且调整页面视图D（适应宽度）
  2. 两个窗口分别在新标签页打开文档A、文档B

  预期结果:
  1. 调整页面视图成功
  2. 文档A页面视图为A（适合页面），文档B页面视图为B（25%）
module: 操作
feature: ''
tags:
  - L2
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 调整页面视图C为200%
    action: element_action
    ref: zoom_combo
    do: click
  - name: 等待
    action: wait
    wait: 0.5
  - name: 输入200
    action: keyboard_type
    text: '200'
  - name: 按Enter
    action: keyboard_press
    keys: Return
  - name: 等待
    action: wait
    wait: 1.0
  - name: 调整适应宽度
    action: element_action
    ref: fit_to_width_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
