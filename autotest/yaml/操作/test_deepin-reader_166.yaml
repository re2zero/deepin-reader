name: '[027]退出全屏方式'
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 进入全屏，点击工具栏右侧退出全屏菜单
  2. 进入全屏，点击键盘esc按钮
  3. 进入全屏，按快捷键F1 1
  4. 进入全屏，右击文档弹出右键菜单，点击“退出全屏”

  预期结果:
  1. 退出全屏
  2. 退出全屏
  3. 退出全屏
  4. 退出全屏
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 按F11进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 按Esc退出全屏
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 1.0
  - name: 按F11再次进入
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 右击推出退出全屏
    action: context_menu_comb
    ref: doc_center
    menu:
      - Exit fullscreen
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
