name: '[028]右键菜单中的全屏与退出全屏菜单'
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 进入全屏，未选中文本右击，查看右键菜单显示

  预期结果:
  1. 全屏菜单变成“退出全屏”
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 右击文档查看菜单
    action: mouse_right_click
    ref: doc_center
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
