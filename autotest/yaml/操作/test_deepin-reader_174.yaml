name: 调整视图后退出全屏
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 进入全屏调整视图（双页显示、适合页面、默认大小、适应宽度、适应高度、每个百分比），退出后查看

  预期结果:
  1. 退出全屏视图状态无变化，百分比数值相应变化
module: 操作
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 进入全屏
    action: keyboard_press
    keys: F11
  - name: 等待
    action: wait
    wait: 1.0
  - name: 按Ctrl1恢复实际大小
    action: keyboard_hot_key
    keys: ctrl,1
  - name: 等待
    action: wait
    wait: 0.5
  - name: 按Ctrl2适应高度
    action: keyboard_hot_key
    keys: ctrl,2
  - name: 等待
    action: wait
    wait: 0.5
  - name: 按Ctrl3适应宽度
    action: keyboard_hot_key
    keys: ctrl,3
  - name: 等待
    action: wait
    wait: 0.5
  - name: 点击双页显示
    action: element_action
    ref: double_page_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 退出全屏
    action: keyboard_press
    keys: Escape
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
