name: 切换高亮颜色
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开普通PDF文档，
  2.打开PDF格式的单页大文档（75M）
  3. 打开docx格式文档

  测试步骤:
  1. 选中已高亮的文本，右击这段文本，点击右键菜单中任意颜色圈图标进行切换，查看
  2. 不选中已高亮的文本，右击这段文本，点击右键菜单中任意颜色圈图标进行切换，查看是否可以切换
  3. 选中一段未高亮的文本，右击这段文本，点击右键菜单中任意颜色圈图标添加高亮，查看
  4. 再次右击这段文本，选择其他颜色进行切换，查看是否切换成功

  预期结果:
  1. 每点击一种颜色，会叠加成混合色
  2. 可以正常切换高亮颜色
  3. 可以正常添加高亮
  4. 可以正常切换高亮颜色
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 等待文档加载
    action: wait
    wait: 2.0
  - name: 选中文本添加高亮
    action: mouse_drag
    ref: doc_center
  - name: 等待
    action: wait
    wait: 0.5
  - name: 右击添加高亮
    action: context_menu_comb
    ref: doc_selected_text
    menu:
      - 高亮
  - name: 等待
    action: wait
    wait: 1.0
  - name: 右击已高亮文本切换颜色
    action: context_menu_comb
    ref: doc_selected_text
    menu:
      - 高亮
  - name: 等待
    action: wait
    wait: 1.0
  - name: 选中未高亮文本切换颜色
    action: mouse_drag
    ref: doc_center
  - name: 等待
    action: wait
    wait: 0.5
  - name: 右击通过颜色圈添加高亮
    action: context_menu_comb
    ref: doc_selected_text
    menu:
      - 高亮
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
