name: 多次搜索
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开docx格式文档

  测试步骤:
  1. 输入关键字并搜索
  2. 按键盘Backspace键删除关键字，重新输入其他关键字并搜索
  3. 点击搜索框中的上下键切换

  预期结果:
  1. 左边栏弹出搜索结果缩略图，文档中关键字被选中
  2. 左边栏正常显示新的搜索结果缩略图，不会叠加显示，右侧文档中显示正常
  3. 左边栏和右侧文档中显示均正确
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 打开搜索
    action: main_menu_comb
    ref: menu_search
  - name: 等待
    action: wait
    wait: 1.0
  - name: 输入关键字并搜索
    action: keyboard_type
    text: document
  - name: 按Enter搜索
    action: keyboard_press
    keys: Return
  - name: 等待
    action: wait
    wait: 1.5
  - name: 删除关键字
    action: element_set_value
    ref: search_input
    text: null
  - name: 输入新关键字并搜索
    action: keyboard_type
    text: page
  - name: 按Enter搜索
    action: keyboard_press
    keys: Return
  - name: 等待
    action: wait
    wait: 1.5
  - name: 点击搜索上一步
    action: element_action
    ref: search_prev_btn
    do: click
  - name: 等待
    action: wait
    wait: 0.5
  - name: 点击搜索下一步
    action: element_action
    ref: search_next_btn
    do: click
  - name: 等待
    action: wait
    wait: 0.5
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
