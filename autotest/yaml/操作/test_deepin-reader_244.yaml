name: 不同百分比显示时进行视图调整
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 百分比调整到10%，分别点击双页显示、适合宽度、 适合高度、适合页面、 左旋转、 右旋转，查看界面显示
  2. 百分比调整到500%，分别点击双页显示、适合宽度、 适合高度、适合页面、 左旋转、 右旋转，查看界面显示

  预期结果:
  1. 界面显示正常
  2. 界面显示正常
module: 操作
feature: ''
tags:
  - L3
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 调整百分比到10%
    action: element_action
    ref: zoom_combo
    do: click
  - name: 等待
    action: wait
    wait: 0.5
  - name: 输入10
    action: keyboard_type
    text: '10'
  - name: 按Enter
    action: keyboard_press
    keys: Return
  - name: 等待
    action: wait
    wait: 1.0
  - name: 点击双页显示
    action: element_action
    ref: double_page_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 点击适合宽度
    action: element_action
    ref: fit_to_width_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 点击适合高度
    action: element_action
    ref: fit_to_height_btn
    do: click
  - name: 等待
    action: wait
    wait: 1.0
  - name: 左旋转
    action: context_menu_comb
    ref: doc_center
    menu:
      - Rotate left
  - name: 等待
    action: wait
    wait: 1.0
  - name: 右旋转
    action: context_menu_comb
    ref: doc_center
    menu:
      - Rotate right
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
