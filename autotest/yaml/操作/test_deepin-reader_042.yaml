name: '[012]关闭搜索'
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开docx格式文档

  测试步骤:
  1. 点击关键字右侧的X，查看显示
  2. 全选关键字，按delete键，或者按backspace删除关键字，查看界面显示

  预期结果:
  1. 搜索框中的关键字被删除，关键字旁边的X消失，搜索结果被关闭，搜索弹框不会关闭，可以继续输入关键字
  2. 只有关键字被删除，界面无变化，搜索结果不会被删除
module: 操作
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 1.0
steps:
  - name: 打开搜索
    action: main_menu_comb
    ref: menu_search
  - name: 等待
    action: wait
    wait: 1.0
  - name: 输入关键字并搜索
    action: keyboard_type
    text: test
  - name: 按Enter搜索
    action: keyboard_press
    keys: Return
  - name: 等待
    action: wait
    wait: 1.0
  - name: 全选关键字并删除
    action: keyboard_hot_key
    keys: ctrl,a
  - name: 等待
    action: wait
    wait: 0.5
  - name: 按Delete键删除
    action: keyboard_press
    keys: Delete
  - name: 等待
    action: wait
    wait: 1.0
  - name: 等待操作生效并验证
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: deepin-reader
teardown:
  - action: session_stop
