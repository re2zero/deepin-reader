name: "弹出搜索结果后退出全屏"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "唤出工具栏点击菜单"
    action: mouse_click
    action: mouse_click
    ref: fullscreen_toolbar
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "点击全屏菜单按钮"
    action: element_action
    action: element_action
    ref: fullscreen_menu_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "选择搜索"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_search
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "输入关键字搜索"
    action: keyboard_type
    action: keyboard_type
    text: the
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "退出全屏"
    action: keyboard_press
    action: keyboard_press
    keys: Escape
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
