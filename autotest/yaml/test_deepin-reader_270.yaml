name: "缓慢移动放大镜，界面无抖动现象"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "开启放大镜"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_magnifer"
  - name: "在文档区域缓慢移动鼠标"
    action: mouse_click
    action: mouse_click
    ref: "doc_center"
  - name: "等待观察"
    action: wait
    action: wait
    wait_after: 2000
teardown:
  - action: session_stop
