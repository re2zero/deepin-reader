name: "[025]多次保存"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "添加书签"
    action: context_menu_comb
    action: context_menu_comb
    ref: "doc_center"
  - name: "点击添加书签"
    action: element_action
    action: element_action
    ref: "context_add_bookmark"
    do: "click"
  - name: "点击主菜单保存"
    action: main_menu_comb
    action: main_menu_comb
    ref: "menu_save"
  - name: "等待保存"
    action: wait
    action: wait
    wait_after: 500
  - name: "再次按Ctrl+S保存"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,s"
  - name: "等待保存"
    action: wait
    action: wait
    wait_after: 500
teardown:
  - action: session_stop
