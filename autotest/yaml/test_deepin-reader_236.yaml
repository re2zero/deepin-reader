name: "按快捷键Windows+D进入桌面，注释浮窗不会单独显示桌面"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "鼠标悬停在注释上"
    action: mouse_click
    action: mouse_click
    ref: doc_annotation_icon
    wait_after: 500

  - name: "按Windows+D进入桌面"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "super,d"
    wait_after: 1000

teardown:
  - action: session_stop
