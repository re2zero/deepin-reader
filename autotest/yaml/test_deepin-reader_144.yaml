name: "删除所有注释"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "添加注释后右键注释目录"
    action: mouse_right_click
    action: mouse_right_click
    ref: annotation_list
    wait_after: 500

  - name: "选择删除所有注释"
    action: context_menu_comb
    action: context_menu_comb
    ref: annotation_list
    menu: "RemoveAnnotation"
    wait_after: 500

  - name: "确认删除"
    action: element_action
    action: element_action
    ref: dialog_confirm
    do: "click"
    wait_after: 500

teardown:
  - action: session_stop
