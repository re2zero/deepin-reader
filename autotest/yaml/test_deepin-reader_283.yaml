name: "未连接打印机，存为PDF"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击菜单键选择打印"
    action: main_menu_comb
    ref: menu_print
  - name: "等待打印预览"
    action: wait
    action: wait
    wait_after: 2000
teardown:
  - action: session_stop
