name: "新开启的窗口中文档打开正常"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "点击新窗口菜单"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_window
  - name: "等待新窗口打开"
    action: wait
    action: wait
    wait: 3.0
  - name: "在新窗口中打开文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证文档在新窗口中正常打开"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "在新窗口中点击新标签页添加文档"
    action: main_menu_comb
    action: main_menu_comb
    ref: menu_new_tab
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择另一个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档2.djvu"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "验证第二个标签页打开"
    action: element_visible
    action: element_visible
    ref: tab_bar

teardown:
  - action: session_stop
