name: "添加高亮注释方式（有高亮显示，无注释小图标显示）"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "选中文本"
    action: mouse_click
    action: mouse_click
    ref: doc_selected_text
    wait_after: 500

  - name: "右键添加高亮注释"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_selected_text
    wait_after: 500

  - name: "选择添加注释"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_selected_text
    menu: "AddAnnotationHighlight"
    wait_after: 500

teardown:
  - action: session_stop
