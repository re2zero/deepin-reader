name: "添加图标注释方式（显示注释小图标，无高亮显示）"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "右键空白区域添加注释"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_center
    wait_after: 500

  - name: "选择添加注释图标"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddAnnotationIcon"
    wait_after: 500

  - name: "输入注释内容"
    action: keyboard_type
    action: keyboard_type
    text: "图标注释内容"
    wait_after: 500

  - name: "点击其他区域完成"
    action: mouse_click
    action: mouse_click
    ref: doc_center
    wait_after: 500

teardown:
  - action: session_stop
