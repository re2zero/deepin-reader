name: "点击超链接"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 2.0
  - name: "鼠标点击超链接文本"
    action: mouse_click
    action: mouse_click
    ref: hyperlink_area
  - name: "等待安全提示弹框"
    action: wait
    action: wait
    wait: 1.5
  - name: "点击关闭按钮"
    action: element_action
    action: element_action
    ref: dialog_hyperlink_warning
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "再次点击超链接"
    action: mouse_click
    action: mouse_click
    ref: hyperlink_area
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
