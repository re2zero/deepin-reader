name: "高亮注释与左侧的注释目录"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "添加高亮注释"
    action: mouse_right_click
    action: mouse_right_click
    ref: doc_center
    wait_after: 500

  - name: "选择高亮"
    action: context_menu_comb
    action: context_menu_comb
    ref: doc_center
    menu: "AddTextHighlight"
    wait_after: 500

  - name: "点击注释按钮验证左侧栏目录添加"
    action: element_action
    action: element_action
    ref: sidebar_annotation_btn
    do: "click"
    wait_after: 500

teardown:
  - action: session_stop
