name: "关闭所有标签页界面显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "打开多个文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择多个文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/文档1.pdf /home/uos/文档2.djvu /home/uos/文档3.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待所有文档加载"
    action: wait
    action: wait
    wait: 8.0
  - name: "验证多个标签页显示"
    action: element_visible
    action: element_visible
    ref: tab_bar
  - name: "关闭所有标签页（关闭窗口）"
    action: element_action
    action: element_action
    ref: title_close_btn
    do: "click"
  - name: "等待关闭"
    action: wait
    action: wait
    wait: 2.0
  - name: "验证应用退出"
    action: process_not_running
    action: process_not_running
    ref: deepin-reader

teardown:
  - action: session_stop
