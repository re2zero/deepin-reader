name: "[042]侧边栏和工具栏同时唤出"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "唤出侧边栏"
    action: mouse_click
    action: mouse_click
    ref: fullscreen_sidebar_btn
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "鼠标移至顶端唤出工具栏"
    action: mouse_click
    action: mouse_click
    ref: fullscreen_toolbar
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击工具栏侧边栏按钮"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "再次点击侧边栏按钮"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
