name: "单个窗口中只打开一个docx标签页，关闭或退出"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开docx文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择docx文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.docx"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 5.0
  - name: "验证文档已打开"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "未编辑状态下点击关闭按钮"
    action: element_action
    action: element_action
    ref: title_close_btn
    do: "click"
  - name: "等待关闭"
    action: wait
    action: wait
    wait: 2.0
  - name: "验证进程已退出"
    action: process_not_running
    action: process_not_running
    ref: deepin-reader

teardown:
  - action: session_stop
