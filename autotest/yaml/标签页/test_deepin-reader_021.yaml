name: 单个窗口中标签页拖拽
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 单个窗口中只有一个标签页，拖拽标签页移出窗口，查看
  2. 单个窗口中只有一个标签页，拖拽标签页移至所在窗口的正文区域，查看
  3. 单个窗口中只有一个标签页，拖拽标签页移至所在窗口内标签栏或工具栏

  预期结果:
  1. 无法拖拽，无提示弹出
  2. 无法拖拽，无提示弹出
  3. 无法拖拽，无提示弹出
module: 标签页
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 打开单个PDF文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择文档
    action: keyboard_type
    text: /home/uos/文档.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证单个标签页
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: page tab list
  - name: 尝试点击标签栏区域
    action: element_action
    ref: tab_bar
    do: click
  - name: 验证页面无变化（无法拖拽）
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
  - name: 添加第二个标签页
    action: main_menu_comb
    ref: menu_new_tab
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择第二个文档
    action: keyboard_type
    text: /home/uos/文档2.djvu
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证两个标签页
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: page tab list
teardown:
  - action: session_stop
