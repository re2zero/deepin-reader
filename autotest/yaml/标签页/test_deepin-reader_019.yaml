name: 关闭标签页
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开pdf格式文档
  2.打开djvu格式文档
  3.打开docx格式文档

  测试步骤:
  1. 打开多份文档文档，点击标签页右侧的+按钮
  2. 退出选择界面，点击标签页中X进行关闭
  3. 打开多份文档文档，其中一份文档A编辑后，点击标签页中X
  4. 点击弹框中的保存
  5. 点击弹框中的不保存

  预期结果:
  1. 进入文件选择界面
  2. 正常关闭
  3. 弹出是否保存的提示弹框
  4. 文档A关闭，再次打开文档A，编辑的内容正常保存
  5. 文档A关闭，再次打开文档A，编辑的内容未保存
module: 标签页
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 打开多个文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择多个文档
    action: keyboard_type
    text: /home/uos/文档1.pdf /home/uos/文档2.pdf /home/uos/文档3.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 5.0
  - name: 验证标签栏显示
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: page tab list
  - name: 点击+按钮添加新标签页
    action: element_action
    ref: tab_add_btn
    do: click
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 取消选择（ESC退出）
    action: keyboard_press
    keys: Escape
  - name: 通过Ctrl+W关闭当前标签页
    action: keyboard_hot_key
    keys: ctrl,w
  - name: 等待关闭
    action: wait
    wait: 1.0
  - name: 验证标签页已关闭
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: page tab list
teardown:
  - action: session_stop
