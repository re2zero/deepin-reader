name: 多窗口多标签页时双击打开文档
app: deepin-reader
screenshot: false
description: |
  前置条件:
  1.打开普通PDF格式文档
  2.打开DJVU格式文档
  3.打开docx格式文档

  测试步骤:
  1. 未打开任何文档查看器窗口时，双击一份文档，查看
  2. 已打开一个文档查看器窗口，双击另一份文档并查看
  3. 有多个窗口时，双击文档并查看

  预期结果:
  1. 文档在一个新窗口中打开
  2. .窗口中新增标签页
  3. 文档展示在最早开启的窗口中
module: 标签页
feature: ''
tags:
  - L1
vars:
  test_file: /home/uos/work/deepin-reader/tests/files/normal.pdf
setup:
  - action: session_start
    command: deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf
    wait: 3.0
steps:
  - name: 打开PDF文档建立第一个窗口
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择文档
    action: keyboard_type
    text: /home/uos/文档.pdf
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 通过新窗口菜单打开第二个窗口
    action: main_menu_comb
    ref: menu_new_window
  - name: 等待新窗口
    action: wait
    wait: 3.0
  - name: 在新窗口中打开文档
    action: keyboard_hot_key
    keys: ctrl,o
  - name: 等待文件对话框
    action: wait
    wait: 2.0
  - name: 选择文档
    action: keyboard_type
    text: /home/uos/文档2.djvu
  - name: 确认打开
    action: keyboard_press
    keys: Return
  - name: 等待文档加载
    action: wait
    wait: 3.0
  - name: 验证多窗口多标签页状态
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: form
teardown:
  - action: session_stop
