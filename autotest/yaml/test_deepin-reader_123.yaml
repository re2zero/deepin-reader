name: "视图调整菜单"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "单页显示时改变百分比"
    action: element_action
    action: element_action
    ref: zoom_combo
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "选择200%"
    action: keyboard_type
    action: keyboard_type
    text: "200"
  - name: "按Enter"
    action: keyboard_press
    action: keyboard_press
    keys: Return
  - name: "等待"
    action: wait
    action: wait
    wait: 1.5
  - name: "按Ctrl+滚轮放大"
    action: mouse_scroll
    action: mouse_scroll
    ref: doc_center
    amount: 3
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "切换到双页显示"
    action: element_action
    action: element_action
    ref: double_page_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "双页时改变百分比"
    action: element_action
    action: element_action
    ref: zoom_in_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 0.5
  - name: "双页时Ctrl+滚轮"
    action: mouse_scroll
    action: mouse_scroll
    ref: doc_center
    amount: 3
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
