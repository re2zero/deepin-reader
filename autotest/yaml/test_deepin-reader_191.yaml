name: "首页Tab键切换"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "按Tab键切换焦点"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter键执行选择"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "按Tab切换焦点"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "tab"
  - name: "按Enter执行"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "enter"
  - name: "按ESC退出菜单"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "esc"
teardown:
  - action: session_stop
