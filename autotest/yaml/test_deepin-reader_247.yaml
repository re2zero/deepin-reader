name: "拖拽窗口界面显示顺畅"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader"
    wait: 3.0

steps:
  - name: "打开PDF文档"
    action: keyboard_hot_key
    action: keyboard_hot_key
    keys: "ctrl,o"
  - name: "等待文件对话框"
    action: wait
    action: wait
    wait: 2.0
  - name: "选择文档"
    action: keyboard_type
    action: keyboard_type
    text: "/home/uos/测试文档.pdf"
  - name: "确认打开"
    action: keyboard_press
    action: keyboard_press
    keys: "Return"
  - name: "等待文档加载"
    action: wait
    action: wait
    wait: 3.0
  - name: "切换双页显示"
    action: element_action
    action: element_action
    ref: double_page_btn
    do: "click"
  - name: "等待切换"
    action: wait
    action: wait
    wait: 1.0
  - name: "点击标题栏"
    action: element_action
    action: element_action
    ref: main_window
    do: "click"
  - name: "拖拽窗口调整位置（模拟鼠标拖动）"
    action: mouse_click
    action: mouse_click
    ref: main_window
  - name: "验证界面显示顺畅"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "切换适应高度"
    action: element_action
    action: element_action
    ref: fit_to_height_btn
    do: "click"
  - name: "等待切换"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证显示正常"
    action: element_visible
    action: element_visible
    ref: doc_view
  - name: "切换适应宽度"
    action: element_action
    action: element_action
    ref: fit_to_width_btn
    do: "click"
  - name: "等待切换"
    action: wait
    action: wait
    wait: 1.0
  - name: "验证显示正常"
    action: element_visible
    action: element_visible
    ref: doc_view

teardown:
  - action: session_stop
