name: "已添加PDF/DOCX文档界面布局显示"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0

steps:
  - name: "查看顶部工具栏"
    action: element_action
    action: element_action
    ref: doc_view
    do: "click"
    wait_after: 500

  - name: "点击菜单键查看菜单项"
    action: main_menu_comb
    wait_after: 500

  - name: "展开左边栏查看底部图标"
    action: element_action
    action: element_action
    ref: sidebar_toggle_btn
    do: "click"
    wait_after: 500

teardown:
  - action: session_stop
