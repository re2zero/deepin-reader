name: "全屏后点击缩略图图标"
app: "deepin-reader"
screenshot: false

setup:
  - action: session_start
    command: "deepin-reader /home/uos/work/deepin-reader/tests/files/normal.pdf"
    wait: 3.0
  - action: wait
    wait: 2.0

steps:
  - name: "进入全屏"
    action: keyboard_press
    action: keyboard_press
    keys: F11
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "唤出工具栏点击缩略图图标"
    action: element_action
    action: element_action
    ref: fullscreen_sidebar_btn
    do: click
  - name: "等待"
    action: wait
    action: wait
    wait: 1.0
  - name: "查看侧边栏显示"
    action: wait
    action: wait
    wait: 1.0

teardown:
  - action: session_stop
